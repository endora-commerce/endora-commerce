# Local development infrastructure for the B2B platform.
# Covers the services required by the constitution's mandated stack (Postgres, Redis, Meilisearch)
# plus Mailhog for capturing transactional email in dev.
#
# Production deployment is out of scope for this file — see README.md.

services:
  postgres:
    image: postgres:16-alpine
    container_name: b2b-postgres
    environment:
      POSTGRES_USER: b2b
      POSTGRES_PASSWORD: b2b
      POSTGRES_DB: b2b
    ports:
      - '5432:5432'
    volumes:
      - b2b-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U b2b -d b2b']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: b2b-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - b2b-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: b2b-meilisearch
    environment:
      MEILI_MASTER_KEY: devMasterKeyChangeMe
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '7700:7700'
    volumes:
      - b2b-meilisearch-data:/meili_data
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://localhost:7700/health']
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: b2b-mailhog
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --spider http://localhost:8025 || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  b2b-postgres-data:
  b2b-redis-data:
  b2b-meilisearch-data:
