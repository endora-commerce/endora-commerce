# Local development infrastructure for the B2B platform.
# Covers the services required by the constitution's mandated stack
# (Postgres, Redis, Meilisearch) plus Mailpit for capturing transactional
# email in dev.
#
# The three stateful images are stated HERE and in the CLI's service catalogue
# (`packages/cli/src/new-instance/deploy.ts`), which renders both a client's
# `deploy/compose.prod.yml` and their `compose.dev.yml`. Two statements of one
# image tag agreed by coincidence until feature 125;
# `packages/cli/test/new-instance/dev-compose.test.ts` now reds on a tag changed
# in one of them and not the other.
#
# Multi-instance support
# ----------------------
# All published host ports come from `.env` next to this file, so several
# checkouts of the repo can run side-by-side on the same machine. Container
# names and volumes are NOT pinned — Compose namespaces them by project name
# (COMPOSE_PROJECT_NAME, default: parent directory name), which keeps each
# checkout's data isolated.
#
# To bring up a second instance:
#   1. `cp .env.example .env` in the second checkout
#   2. change the *_PORT values (and optionally COMPOSE_PROJECT_NAME)
#   3. `docker compose up -d`
#
# Production deployment is out of scope for this file — see README.md.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-b2b}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-b2b}
      POSTGRES_DB: ${POSTGRES_DB:-b2b}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - b2b-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-b2b} -d ${POSTGRES_DB:-b2b}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - b2b-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-devMasterKeyChangeMe}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '${MEILISEARCH_PORT:-7700}:7700'
    volumes:
      - b2b-meilisearch-data:/meili_data
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://localhost:7700/health']
      interval: 5s
      timeout: 3s
      retries: 10

  # Mailpit, not MailHog: measured 2026-09-14 through the GitHub API,
  # `mailhog/MailHog`'s last commit is 2024-02-13 and `axllent/mailpit`'s is
  # 2026-09-06. Same two ports, same SMTP contract, so `SMTP_URL` does not move.
  mailpit:
    image: axllent/mailpit:v1.31
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025' # SMTP
      - '${MAILPIT_UI_PORT:-8025}:8025'   # Web UI
    healthcheck:
      # 127.0.0.1 and not localhost, for the reason the search engine's check
      # carries: busybox wget gives up on the first refusal.
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:8025/readyz']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  b2b-postgres-data:
  b2b-redis-data:
  b2b-meilisearch-data:
