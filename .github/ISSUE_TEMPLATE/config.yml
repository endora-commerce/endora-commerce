# Blank issues are off: every report starts from a form, so it arrives with the
# version and the reproduction a maintainer would otherwise have to ask for.
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/endora-commerce/endora-commerce/security/advisories/new
    about: Never in a public issue. Use private vulnerability reporting, as SECURITY.md describes.
  - name: Documentation
    url: https://docs.commerce.endora.software
    about: Installing, configuring and operating Endora Commerce, and every module's own pages.
