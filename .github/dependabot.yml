version: 2

# Keeps runtime dependencies and CI tooling fresh while honouring
# Constitution Principle IV (YAGNI / minimal dependencies). Each group of
# updates lands as one PR per ecosystem per week, so reviewers see the
# smallest dependency-justification surface possible.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: chore(deps)
      include: scope
    ignore:
      # MikroORM majors move every @mikro-orm/* package and every module's
      # peer range together; that is a planned migration (#1073), not a bump.
      # Remove this entry when #1073 is done.
      - dependency-name: "@mikro-orm/*"
        update-types:
          - version-update:semver-major
    groups:
      production:
        dependency-type: production
        update-types:
          - patch
          - minor
      development:
        dependency-type: development
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore(ci)
