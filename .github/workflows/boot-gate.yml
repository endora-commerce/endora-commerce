# `boot-gate` on GitHub Actions — tranche 1 of the gate window.
#
# `specs/129-github-canonical-migration/contracts/gate-window.md` §4.2 is the
# specification and T042b is the task: due by day 0 + 7. The gate builds the
# production image, migrates a throwaway database, boots it and asks the running
# platform whether every module installed and every overlay composed — then,
# under `--with-negatives`, derives two broken images and requires each to go
# red. `scripts/boot-gate.sh` and the paragraph above `boot-gate:` in
# `.gitlab-ci.yml` carry the reasoning; it is not copied here.
# `backend/test/unit/ci/actions-tranche-one-parity.test.ts` holds this file
# equal to the GitLab job in what it runs and in when it runs.
#
# ## When it runs
#
# GitLab's two rules, one per trigger: every push to `master`, unfiltered, and a
# pull request that touches what the image is built from — GitLab's `changes:`
# list with `.gitlab-ci.yml` replaced by this file. `scripts/` is named whole
# because `backend/Dockerfile` copies it whole, and the gate's own scripts are
# under it; `backend/test/unit/ci/boot-gate-image-inputs.test.ts` derives the
# image's inputs from the Dockerfile and refuses a filter that does not cover
# them. A separate workflow because a `paths` filter applies to a whole
# workflow; if this check is ever made required (T033), the filter must go in
# the same change, because a skipped workflow reports no status and would block
# a pull request outside it forever.
#
# ## Docker, and nothing else
#
# GitLab runs this in `docker:27` against a `docker:27-dind` service, with
# `DOCKER_HOST` pointing at the service and `bash` added to the alpine image. A
# GitHub-hosted `ubuntu-24.04` runner has a Docker engine and `bash` of its own,
# so none of that is needed: the gate already speaks HTTP from a container on its
# own docker network rather than through a published port, which is what makes
# it indifferent to where the daemon is. Postgres, Redis and Meilisearch are
# containers the gate starts itself, not service containers, so nothing here
# declares one. No install, no build, no credential.

name: boot-gate

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/**/*'
      - 'packages/**/*'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'backend/Dockerfile'
      - '.dockerignore'
      - 'scripts/**/*'
      - 'deploy/compose.prod.yml'
      - '.github/workflows/boot-gate.yml'
  push:
    branches: [master]

concurrency:
  group: boot-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  boot-gate:
    name: boot-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash scripts/boot-gate.sh --with-negatives
