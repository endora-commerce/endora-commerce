# GitLab CI/CD — quality gates, build + push Docker images, deploy to the VPS.
#
# Pipeline:
#   quality  → typecheck + lint, plus the toolchain-free naming/language
#              conventions check (fast, every push/MR)
#   test     → migrate + full vitest with postgres/redis/meilisearch services
#   build    → build & push backend/storefront/admin images to the Container Registry
#   deploy   → SSH to the VPS, pull tagged images, run migrations, recreate the stack
#
# build + deploy run on the default branch only; deploy is a MANUAL gate.
#
# Every job that executes repository code runs `pnpm run build:packages` after the
# install — every one, with no exception. Since feature 080 (T042) the packages under
# `packages/` resolve through their own `exports` maps at `./dist`, so an unbuilt
# workspace is an unresolvable `@endora-commerce/*` specifier rather than a slightly
# stale one; and since the platform relocation (!908) all of
# `backend/src/{kernel,http,tenancy,commands,events}` re-exports from
# `packages/platform/dist`, so an unbuilt workspace is a repository in which almost
# nothing resolves at all.
# `release:changeset` used to be listed here as the one node job without the step, on
# the ground that it "runs the changesets CLI and imports nothing of ours". That was
# true when it was written and false by the time it mattered — the job had grown
# `check:release-intent` and `test:release-gate`, both of which are ours — and the
# sentence went on standing because nothing read it. `test/unit/ci/toolchain-supply.test.ts`
# is the same statement as a predicate over this file: a job whose script runs a workspace
# filter and whose `before_script` does not build fails by name. Do not re-open the
# exception in a comment; if a job genuinely needs one, it needs one in that test.
# Ruling R12 — a build script only a developer ever runs is configuration, not a build;
# `outDir` had been configured in all five packages since they were created and had never
# been executed, which is how a `rootDir` defect sat latent in three of them.
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   Per-instance build inputs (feature 110, FR-009). The set, each input's meaning,
#   its default and the build argument each image reads are declared **once**, in
#   `packages/cli/src/lib/instance-build-inputs.ts` — they are an instance's inputs
#   and not this pipeline's, so a client's own pipeline is rendered from the same
#   declaration (D-207, D-208). The `--build-arg` lines in the three build jobs
#   below are what that declaration emits, and
#   `backend/test/unit/ci/instance-build-inputs.test.ts` fails on a job, a
#   Dockerfile or a mapping that has drifted from it. Do not add a fifth input here:
#   add it there, or say why it is not derived.
#     DEPLOYMENT              e.g. acme              (overlay modules + divergence)
#     API_DOMAIN              e.g. api.example.com
#     SALES_CHANNEL_CODE      e.g. pl_default
#     DEFAULT_LOCALE          e.g. en-US             (defaults to en-US)
#   Domains this pipeline deploys to, which are not build inputs:
#     STOREFRONT_DOMAIN       e.g. example.com
#     ADMIN_DOMAIN            e.g. admin.example.com
#   Deploy:
#     SSH_PRIVATE_KEY  (type File, protected)  deploy key for the VPS user.
#                      Masked type rejects multi-line values, so use type=File:
#                      the variable then resolves to a PATH to the key file.
#                      End the value with a trailing newline or ssh-add fails.
#     SSH_KNOWN_HOSTS  (type File, protected)  output of `ssh-keyscan <vps-host>`.
#     DEPLOY_HOST      (protected, masked)     VPS hostname/IP
#     DEPLOY_USER      (protected, masked)     VPS ssh user (member of the docker group)
#     DEPLOY_PATH      (protected)             dir on the VPS holding compose.prod.yml + .env (e.g. /opt/b2b)
#   Publish (feature 104, D-203 — `publish:packages`, on a release branch only):
#     ENDORA_NPM_REGISTRY (protected)          the npm endpoint to publish to, with its
#                      trailing slash — GitLab's own troubleshooting says the scoped URL
#                      carries one. Unset is exit 2 rather than a publish to npmjs.
#     ENDORA_NPM_TOKEN (protected, masked)     a token that may write packages there.
#                      Protected, so `release/*` has to be a protected branch pattern or
#                      the job refuses; it is written into `.npmrc` as `${ENDORA_NPM_TOKEN}`,
#                      an environment reference pnpm expands, so no file holds the value.

stages:
  - quality
  - test
  - build
  - deploy

default:
  interruptible: true

variables:
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

# ---------------------------------------------------------------------------
# Quality — typecheck + lint
# ---------------------------------------------------------------------------
quality:
  stage: quality
  image: node:22.17-slim
  variables:
    # `tsc --noEmit` over this monorepo needs a bigger heap than Node gives
    # itself on the dedicated runner, and the reason is not the tree's size —
    # it is that the job container now HAS a memory limit. Node sizes its
    # default old-space from what it believes is available; an unlimited
    # container showed it the host's 7.9 GB, a 3 GB one shows it 3 GB, and
    # `tsc` died at 1.53 GB (pipeline 11605, exit 134).
    #
    # **Per job, not global.** It was set globally first, on the argument that
    # five Node jobs carried no heap and fixing only the one that failed first
    # is a fix for the accident of ordering. The argument was right about the
    # risk; the remedy was wrong, because `NODE_OPTIONS` reaches **every**
    # process, including each of `vitest.unit.config.ts`'s four forks, and a
    # single-process job and a forked pool want opposite things from one
    # number.
    #
    # **Correction to what the commit that moved it said**: the global setting
    # did **not** cause `test:backend:unit`'s exit 137. MR !951's pipeline runs
    # on a base that predates it — no global `NODE_OPTIONS` anywhere — and that
    # job exited 137 there too. The fork pool exceeds 3 GB either way, and this
    # config's own comment says why: 299 files in one process reach V8's 4 GB
    # default, which is what four forks exist to bound, and the suite is now
    # 447 files. That job has most likely always wanted more than 3 GB; nothing
    # limited it before, so nobody measured it. **The container limit did not
    # cause that failure, it made it visible — which is what it is for**, and
    # the fix is the runner's `memory`, not this file.
    #
    # **2048 -> 2560, because the backend program grew past it** (pipeline
    # 12269, exit 134). Bracketed in this job's own image, `node:22.17-slim`
    # in a 3 GB container, running `tsc -p backend/tsconfig.json --noEmit`
    # directly: 2048 is not a margin, it is the **cliff** — three of four runs
    # died with V8's named `Reached heap limit`, the fourth passed — and 2080
    # passed twice, as did 2112, 2176, 2240, 2304 and 2560. So the requirement
    # today sits between **2048 and 2080 MB**, and it has sat *on* 2048 for a
    # while: that is why `master` was intermittently green, and why the same
    # commit type-checks on a developer's machine, where Node 26 defaults the
    # old space to about 4 GB and nothing here applies.
    #
    # **The `(2083.7) MB` in that crash log is not the cap and must not be read
    # as one.** It is V8's *total* limit — the 2048 MB old space plus the
    # semi-spaces — so it looks like a default nobody set and is in fact this
    # very setting. `--max-old-space-size=2083`, which is a different and
    # larger heap, passes three runs out of three; the bracket below is stated
    # in the units this variable is written in.
    #
    # **The ceiling is the container, not the host.** The job container's limit
    # is 3072 MB, and the cgroup's own `memory.peak` says ~130 MB of the
    # process sits outside the old space: the run that died with its heap full
    # at 2080 MB peaked at 2210 MB. A cap at or near 3072 would therefore turn
    # a genuine exhaustion into a cgroup SIGKILL (137) instead of the named V8
    # error — the failure mode `test:backend:unit` has, which AGENTS.md rules
    # is the runner's `memory` setting to answer and not this file's. That puts
    # the usable ceiling near 2816. 2560 is chosen inside it, with ~480 MB over
    # the measured requirement and ~330 MB between the worst case (2560 filled,
    # plus overhead) and the container.
    #
    # **What the raise costs the shared host, which is the question the Memory
    # block above `test:backend` makes the important one: 104 MB, not 512.**
    # `--max-old-space-size` is a cap, not an allocation — a larger one only
    # lets V8 collect less eagerly, so the job's real footprint moves by what
    # the collector stops reclaiming, not by the 512 MB the number moved.
    # Measured from the container's own cgroup, `node:22.17-slim` under
    # `--memory=3g`, running this job's two script lines: **2292 MB** at 2048
    # (with the typecheck dying) and **2396 MB** at 2560 (green) — **+104 MB**.
    # Over `pnpm -r run typecheck` alone the same pair is 2210 -> 2392 MB.
    # Neither run touched the container: `memory.events` reads `max 0,
    # oom_kill 0` on both.
    #
    # **Concurrency.** `quality` carries no `resource_group`, and stages
    # serialise only within a pipeline, so this job can run beside a
    # `test:backend` shard of *another* pipeline — 2396 MB next to that job's
    # measured 2521 MB, on the 7.9 GB box the Memory block describes. Putting
    # `quality` into `backend-suite` was considered and **rejected**: it would
    # queue every merge request's typecheck behind a two-hour test stage from
    # an unrelated pipeline, and that same block already records that
    # `resource_group` cannot see the neighbour which actually causes the
    # host's OOM kills. Inside the job there is nothing to contend with when it
    # matters — `pnpm -r run typecheck` is topological, `backend` is last, and
    # that whole recursive run's peak (2392 MB) is 79 MB above `backend` on its
    # own (2313 MB).
    #
    # **What would make this decision wrong later.** The program is 5907 files,
    # 3.17M instantiations, 2.32 GB of `tsc`'s own `Memory used`, and it is the
    # *test* tree: `src/**` alone is 2450 files and 665 MB, while `test/**`
    # — which pulls `src` in — is 5882 files and 2.16 GB. `backend/test` went
    # from 483 files to 1572 in three months, so this number will be reached
    # again. The structural answers were measured rather than assumed, and two
    # of the three buy nothing: project references and a narrower `include` are
    # already in force, because the 66 module packages have no `paths` entry
    # and so enter as `.d.ts` (their cheapest representation) while
    # `backend/src` is 144 files; and splitting `src` from `test` buys nothing
    # because the test program subsumes `src`. The one real lever, splitting
    # `backend/test` in two (`unit` | `contract`+`integration`+`perf`),
    # measured **1957 MB** and **1816 MB** peak — 15% off the peak for a second
    # ~50 s program over ~5000 files, plus an invariant nothing checks: a test
    # directory in neither config is silently unchecked, which is issue #215's
    # shape and would need a check of its own. So when 2560 is reached, raise
    # the runner's container `memory` first — it is a runner setting, and the
    # same answer AGENTS.md already gives for `test:backend:unit` — and split
    # only when the container can no longer grow. Do **not** raise this number
    # past ~2816 while the container is 3 GB: above that the named error is
    # lost and the job starts failing as a SIGKILL instead.
    NODE_OPTIONS: --max-old-space-size=2560
  before_script:
    - corepack enable && corepack prepare pnpm@9.15.0 --activate
    - pnpm install --frozen-lockfile
    - pnpm run build:packages
  script:
    - pnpm -r run typecheck
    - pnpm -r run lint
    # Feature 050 — every persisted entity must carry exactly one tenant-scope
    # classification decorator (fails the build on any unclassified entity).
    - pnpm --filter backend exec tsx scripts/check-entity-tenant-classification.ts
    # Feature 053 (FR-011) — no storefront module may re-resolve the sales
    # channel outside the canonical resolver. Feature 072 (D-42) added a third
    # signal to the same script: no settings read may name its channel with a
    # string literal that is not a channel id — "no channel" is `null`. Scans
    # all of `src/**`, because half that family lived in `composition.ts` and in
    # a module's `scripts/`. Allow-list is empty; enforced.
    - pnpm --filter backend exec tsx scripts/check-channel-resolution.ts --enforce
    # Feature 054 (FR-009) — every sensitive write must run through the Command
    # Bus (record audit / run a Command) or carry a documented
    # `command-coverage-ignore` escape hatch. Platform-wide rollout is complete
    # (all 45 modules migrated), so `--strict` build-breaks on ANY finding in ANY
    # module — a new unaudited write anywhere fails CI (no silent regression).
    - pnpm --filter backend run check:command-coverage -- --strict
    # Feature 072 (D-32) — a module may declare an ORM relation into the kernel,
    # never into another module; the kernel relates into neither. The allow-list
    # is an empty ratchet.
    - pnpm --filter backend run check:kernel-boundary
    # Feature 075 (FR-020) — the other direction across the same boundary: a
    # module may not import another module's internals, in any of the eight
    # shapes a specifier takes. 072 and 073 finished the runtime half (891 port
    # resolutions, zero violations); this is the compile-time half, and it was
    # 674 sites the day the check landed — 43% of them `import type`, which the
    # first attempt to measure it omitted and undercounted by 2.2×. The ledger
    # is sharded one file per consumer module under
    # `backend/scripts/ledgers/cross-module-imports/`, so cutting a module
    # touches only its own shard, and it fails five ways: an unledgered import,
    # a stale entry, an empty shard, an orphan shard and an entry filed under
    # another module's shard.
    - pnpm --filter backend run check:module-boundary
    # Feature 091 (FR-009/FR-016) — a module reaching admin platform surface
    # `@endora-commerce/admin-kit` does not publish. `check:platform-surface`
    # asks this on the backend and had no frontend twin, because until Phase 1b
    # the admin's design system was 74 files under `admin/src` reachable by an
    # alias that resolves for every file in the application and for nothing an
    # installed package runs under. A target is published iff it is a re-export
    # shim into the kit — read from the file, never listed — so a shim that
    # grows a local declaration makes every module reaching it a finding in the
    # same run.
    - pnpm --filter backend run check:admin-surface
    # Feature 091 (P4a) — the zone mechanism's two-way refusal, which
    # `AdminZoneNameSchema`'s own contract promised from the day it landed and which
    # nothing implemented in either direction: every one of its four opening members
    # was rendered by nothing and contributed to by nothing. Plus `foreign-module-id`,
    # one predicate over three populations — a module id written as a string literal in
    # a file the module does not own — which no other instrument here can see, because
    # `check:module-boundary` reads import specifiers and a string names none.
    - pnpm --filter backend run check:admin-zones
    # Feature 072 (FR-020) — every non-HTTP entry point (CLI script, BullMQ
    # consumer, repeating-timer sweep) establishes a scope explicitly. The timer
    # class was `setInterval(` as a string until issue #128, so `search`'s
    # reindex loop — a `setTimeout` its callback re-arms — was never in the
    # population and its unmet FR-020 sat behind a count that could not move. The
    # shape now comes from `scripts/lib/repeating-timers.ts`, shared with
    # check:entry-presence below.
    - pnpm --filter backend run check:entry-scope
    # Feature 072 (FR-032) — no module imports the container library. Modules see
    # only `ModuleContext`, so the container stays swappable behind that seam.
    - pnpm --filter backend run check:container-imports
    # Feature 072 (FR-040) — a module declares the modules whose ports it
    # resolves. Hard from the first run: it measures container resolutions, not
    # imports, so it found one violation while three modules are converted —
    # each conversion pays for its own declarations instead of leaving a
    # 261-entry allow-list nobody will drain.
    - pnpm --filter backend run check:port-dependencies
    # Issue #84 — a `catch` around a gated-port call may not swallow
    # `ModuleDisabledError`. `lazyPort` resolves inside the forwarded call, so
    # the presence answer arrives at the call site, and a bare `catch` turns
    # fail-closed into fail-open silently. Carries `PORT_CATCHES_TO_DRAIN`, a
    # two-way ratchet: an unledgered bare catch fails, and so does a ledger
    # entry that no longer describes one.
    - pnpm --filter backend run check:port-catches
    # D-97.3 — a published port may not declare an optional method. Feature
    # detection through a port is impossible: `lazyPort`'s proxy answers every
    # property with a function, so `if (port.maybe)` is always true and the
    # forward throws when the provider has none. `catalog` widened the
    # custom-field read port with `publishInvalidate?` and turned a benign,
    # self-healing cache window into a 500 on the attribute screens. No ledger —
    # the one occurrence is deleted, and an entry would be a licence to re-open
    # it.
    - pnpm --filter backend run check:port-shape
    # Issue #107 — a module subscribes to the EventBus through `ctx.subscribe`,
    # never a bare `eventBus.on`. Routes and workers each had a seam check;
    # subscriptions had none, and twenty-two accumulated across nine modules
    # while every one of those modules' conversion tasks read done — ten of them
    # writing to the platform's own database (an invoice issued and e-mailed, a
    # quote request completed, a push message row delivered to a device) and
    # twenty-one of the twenty-two mutating something, for a module an operator
    # had switched off.
    # `BARE_SUBSCRIPTIONS_TO_DRAIN` is an empty two-way ratchet: an unledgered
    # bare subscription fails, and so does a ledger entry that no longer
    # describes one.
    - pnpm --filter backend run check:subscribe-seam
    # Issue #200 — SQL written inside a transaction runs inside that transaction.
    # `em.getKnex()` is `getConnection().getKnex()` and a connection is not a
    # transaction: the statement takes its own pooled connection and commits
    # immediately, so a rollback cannot reach it. `PromotionUsageService.finalize`
    # incremented usage counters that way and left a redemption row pointing at an
    # order the rollback had removed (D-94); the sweep found sixty-five more,
    # fifty-one of them writes, including a megamenu tree that a refused save
    # deleted outright. Only the
    # lexically decidable population is read — a `transactional(` callback and a
    # Command's `run` — because whether an arbitrary method has a transaction open
    # is a question about its callers. `CONNECTION_LEVEL_SQL_IN_TRANSACTIONS` is an
    # empty two-way ratchet.
    - pnpm --filter backend run check:transaction-context
    # Feature 080, T061 — a module package's process singletons exist once. The
    # platform composes a package through its published artefact ('dist', via the
    # bare specifier); a filesystem path into the same package's source evaluates
    # it a second time. T040c measured that for the platform's five directories —
    # 59 runtime values, none shared, and `instanceof HttpError` false across the
    # boundary — and D-160.6 wrote the rule down about entity classes, where the
    # failure is a loud lookup miss. A duplicated module-scope **value** fails
    # silently instead: the second copy is simply empty. It happened in two
    # consecutive packaging batches — `paymentAdapterRegistry` in batch one, and
    # in batch two a second, empty `ShippingAdapterRegistry` that made a
    # switched-off carrier module read as *present*, because the adapter was never
    # found and the shipment path took its "no carrier configured" branch. Neither
    # was visible to `tsc`, to any other check, or to `test:unit:fast`. The rule is
    # a conjunction of two derived facts — both copies in one process, and the
    # platform composed the reached object — so the correct reaches (a unit test
    # over a stub EntityManager) are cleared by derivation rather than ledgered.
    # `WHOLE_FILE_REACHES_ALLOWED` is the two-way ledger for the reaches that name
    # no binding.
    - pnpm --filter backend run check:singleton-identity
    # Issue #126 / #146 — an entry point nothing can catch a throw from decides
    # presence before it works. Routes, workers and subscribers each have a seam;
    # a timer a module starts in its own plugin body had none, and `price_lists`
    # went on activating and expiring price lists five minutes at a time with the
    # module switched off — it changed what customers were charged. Sees
    # `setInterval`, a self-rescheduling `setTimeout`, `process.on` and — since
    # D-68 — a `ctx.onBoot` hook that does work in a switchable module, which is
    # how a switched-off `product_feeds` kept writing BullMQ scheduler keys at
    # every deploy. A hook that only contributes a descriptor passes silently,
    # and one that does both is reported as `mixed-boot-hook` with "split it
    # first" rather than "probe the top", because probing a mixed hook stops the
    # contribution too. `TIMERS_WITHOUT_PRESENCE` and `BOOT_HOOKS_WITHOUT_PRESENCE`
    # are two-way and are not expected to empty: an entry says why a site is right
    # to keep running while its module is off.
    - pnpm --filter backend run check:entry-presence
    # Issue #216 — a reason string may not assert a lock the manifests
    # contradict. The locked set is derived from `activation.nonDeactivatable`
    # on every run (`scripts/lib/switchable-modules.ts`), so a sentence
    # restating it is a copy no run re-derives: a shard withdrew a written port
    # conversion on the ground that a module with an activation control could
    # not be switched off, and nothing in the repository could tell. D-100
    # forbade the shape in acknowledged-edge reasons; this enforces it wherever
    # a reason is written — ledger shards, the ledgers that live inside a check,
    # and every module manifest. No ledger: a claim the manifests contradict is
    # never right to stand.
    - pnpm --filter backend run check:lock-claims
    # Issue #232 — a manifest action's `requiredPermission` is the code enforced
    # on its own `targetRoute`. The permission inventory sweeps two directions,
    # enforced ⇒ grantable and grantable ⇒ enforced, and both of the defects that
    # produced this check passed it: `settings`' palette entry declared no code
    # at all against an `settings:read` route, and `inventory`'s declared
    # `catalog:write` against an `orders:read` one — real codes, enforced
    # somewhere, on the wrong route. Agreement is sufficiency, not equality, so a
    # member of an any-of gate passes it. `ACTION_PERMISSION_DISAGREEMENTS` is a
    # two-way ratchet holding the three verb-labelled actions whose screen needs
    # a read code to open and a write code to use — a single field cannot say
    # both, and the choice is the owner's.
    - pnpm --filter backend run check:action-route-permissions
    # Issue #111 — a test releases a harness-owned resource through
    # `teardownBackendServer`, never by closing it itself. Seventy-seven files had
    # copied the same three lines (`app.close`, `redis.disconnect`, `orm.close`)
    # and none of them disposed the awilix container or disconnected the pub/sub
    # Redis client, because neither existed when the shape was first copied — a
    # hand-written teardown is a copy of the seam frozen at the moment it was
    # copied, and nothing can teach it about a resource added later. The suite
    # runs in a single fork, so one abandoned client per composed server
    # accumulates for the whole run. `HAND_RELEASED_RESOURCES_TO_DRAIN` is an
    # empty two-way ratchet.
    - pnpm --filter backend run check:harness-teardown
    # Issue #159 — a test does not turn "the row is not there" into a value that
    # looks like data. Six files carried
    # `(await em.findOne(SalesChannel, { systemDefault: true }))?.id ?? ''`, and
    # every one was green only because another file's `setupBackendServer` had
    # created the channel first; against a fresh database
    # `cart-abandonment-worker.integration.test.ts` failed all six of its tests
    # with `invalid input syntax for type uuid: ""`. `null`/`undefined` fallbacks
    # and `expect(x ?? null)` normalisation are out of the population on purpose:
    # they keep the absence in the type. `DEFAULTED_FIXTURE_READS` is two-way and
    # is not expected to empty — an entry says why the fallback is right.
    - pnpm --filter backend run check:fixture-substitution
    # Issue #166 — the same defect pointing the other way: a test that *empties*
    # a shared table instead of reading one another file seeded. Eight comparison
    # files ran `nativeDelete(Comparison, {})` in a `beforeEach`, which is what
    # let four of them assert `toHaveLength(1)` over the whole table — a claim
    # about the platform rather than about the row the test created.
    # `UNSCOPED_WIPES_BASELINE` is a per-file two-way ratchet over the 197 wipes
    # that stood when it landed: a new one fails, and so does a number left
    # standing after the deletes under it were scoped.
    - pnpm --filter backend run check:shared-table-wipes
    # Issues #182 / #190 — no source file carries a raw NUL byte. Git classifies
    # a blob with a NUL in it as binary, so every diff of that file reads
    # "Binary files differ": the one artefact that would have caught the byte is
    # the one the byte switches off, which is how six files kept a raw NUL in a
    # template literal through every review of every commit that touched them.
    # Reads the whole file rather than git's own first 8000 bytes — one of the
    # six sat at byte 8032 and git itself still called it text.
    # `NUL_BYTES_ALLOWED` is an empty two-way ratchet.
    - pnpm --filter backend run check:nul-bytes
    # Issue #240 — the admin folds diacritics in one place. The one-liner
    # `normalize('NFD').replace(/\p{Diacritic}/gu, '')` reads as complete and is
    # not: `ł` is a standalone code point with no canonical decomposition, so NFD
    # leaves it where it was and the strip removes nothing. Four private copies
    # had grown by !745 — typing `naglowek` found no block named `Nagłówek`, and
    # `platnosci` found no `Metody płatności` in any picker — and the only thing
    # standing between them and a fifth was a paragraph in a file header. Reads
    # literal AST nodes, so the four files that quote the wrong one-liner to
    # explain why they do not use it are out of the population by construction.
    # `DIACRITIC_FOLDS_ALLOWED` is a per-file two-way ratchet holding the two
    # slugifiers whose NFKD mappings are baked into persisted slugs (issue #239).
    - pnpm --filter backend run check:diacritic-folds
    # Documentation code blocks are quotations, not paraphrases. The quickstarts
    # are copied by every module conversion, so a stale snippet is a defect
    # scheduled for mass production — six were found across three batches before
    # this check existed.
    - pnpm --filter backend run check:doc-snippets
    # `specs/100-module-owned-documentation/` — the documentation navigation
    # describes the modules the platform composes. `overlay:check` asks whether
    # each artefact is what the generator would emit; this asks whether the
    # generator is looking at everything it should, which is a different
    # question and the one that was wrong: a generator emitting a correct
    # sidebar for the 62 modules it could see agreed with itself perfectly while
    # eight written pages were reachable from no navigation, 23 registered
    # modules had no map row and four page slugs named no module. Nothing in the
    # repository could see any of it, because the one instrument that could —
    # Docusaurus's own `checkSidebarsDocIds` — ran in a build that existed in no
    # CI job. `build:docs` below is that half.
    - pnpm --filter backend run check:module-docs
    # Principle VIII — an error code the operator can see has a sentence, in both
    # shipped languages. The envelope replaces the message wholesale with the
    # bundle string, so a missing key renders the raw code and nothing reports it:
    # `credentials` shipped eight written, translated sentences under keys the
    # envelope does not read, while all six of its codes rendered untranslated.
    # The ledger is the standing debt and may only shrink.
    - pnpm --filter backend run check:error-translations
    # `specs/094-translation-boundary/` — the owner's ruling of 2026-09-01: a
    # module that ships a bundle in any language ships one in every language the
    # platform ships. A **conditional**, because 7 of the 69 registered modules
    # legitimately ship none and a universal would be repaired by seven empty
    # files. It lands at zero violations, which is the argument for landing it:
    # nothing held the invariant there.
    # `registered-bundles-shape.test.ts` looked like the enforcer and was a
    # two-way miss — its symmetry case skipped exactly the module that drops a
    # bundle, and its action-key case asked each module about the languages it
    # happened to ship. Both are repaired in the same merge request; this check
    # is the file-level precondition neither of them can be.
    # No ledger, deliberately: an entry could only license a single-language
    # module, which is the thing the ruling forbids.
    - pnpm --filter backend run check:bundle-pairing
    # Feature 096 —
    # `specs/096-page-builder-block-ownership/contracts/block-name-check.md`.
    # A Puck block name is written into `jsonb` and never rewritten, and no
    # existing check's population contains one: `check:module-boundary` reads
    # import specifiers and SQL tables, `check:admin-zones` reads zone names and
    # `useTranslation` scopes, `i18n:hardcoded` reads JSX. Eight findings over
    # two site kinds — a `{ type, props }` node literal in a module's own
    # sources, and a `components` key or a `switch (node.type)` case in a
    # renderer — reconciled against what the manifests declare, in both
    # directions. One ledger, `BLOCKS_WITHOUT_A_RENDERER`, and it lands empty.
    - pnpm --filter backend run check:block-names
    # Feature 073 (Constitution XVII item 6) —
    # `specs/073-lifecycle-gating-completion/contracts/off-state-coverage-ratchet.md`.
    # Which modules actually carry an off-state proof was re-derived by hand
    # three times and gave three different answers, because both careful
    # attempts keyed on the **path** a test file sits at: `payments` is named by
    # six files and not one of them is under `payments/`, and `customers` was
    # missed by both. The predicate is the **argument** of an
    # `expectModuleAbsent` call, resolved through the shapes the tree writes —
    # a bare `withModuleOff` is a state seam and never coverage, which is the
    # tiering. It lands at zero findings with an empty ledger.
    - pnpm --filter backend run check:off-state-coverage
    # `specs/106-module-owned-tests/contracts/module-test-ownership.md` — a test
    # file belongs to the module it is about, and a module package's tests are
    # configured to run. Feature 106 moved 211 files into 56 packages and its
    # instrument did not ship with them: 185 harness-free single-owner files were
    # left under `backend/test` with nothing reporting them, nothing stopping the
    # 186th, and 56 packages' `vitest.config.ts` guarded by nothing — a
    # configuration whose deletion leaves test files that no job collects, which
    # is the state that looks greenest.
    # Ownership is the file's **import specifiers**, never the directory it sits
    # in: that predicate was tried three times in this repository and gave three
    # different answers, because a file in one module's directory routinely names
    # another. The ledger arrives holding the 185, split into `scheduled` and
    # `retained` so the drain is a number on every run rather than a diff nobody
    # sums.
    - pnpm --filter backend run check:test-ownership
    # `specs/094-translation-boundary/` — the same ruling's first clause: English
    # is the default, so a prose literal in another language, outside a
    # per-language structure, in a module's own sources is a defect. The second
    # signal, in a check of its own because `check:untranslated-delivery` asks
    # about a delivery *call* — a `return`, an array push and a field assignment
    # are none of them — and `check:language`'s scope is comments by
    # constitutional design (D-8).
    # It lands **red-free and not empty**: 46 sites over 41 keys, recorded in a
    # per-module ledger under `scripts/ledgers/non-english-defaults/`, two-way
    # and expected to empty. What it refuses is the 42nd.
    - pnpm --filter backend run check:default-language-prose
    # `specs/098-storefront-ssr-seo-a11y-suite/` Phase 2 (FR-010…FR-014) — every
    # storefront route says whether a crawler may index it, and the sitemap and
    # the route table agree in both directions. Before it, the reference
    # storefront told crawlers nothing at all: no `sitemap.ts`, no `robots.ts`,
    # and not one canonical. Under D-195 that template is what every client
    # instance is copied from, so this is the only place the property is
    # enforceable once.
    # The population is the 57 `page.tsx` files, not the 67 route files — five
    # are API handlers, five are layouts, and 48 of the pages are account, auth
    # and checkout surfaces that must **not** be indexed; a canonical on
    # `/account/password` would be a defect.
    # Its second author is `storefront/app/sitemap.ts`'s own declared route set,
    # which is a Constitution VII deliverable in its own right rather than a
    # fixture built to satisfy a check. No ledger, deliberately: every finding
    # is one line away from compliance in the merge request that produces it.
    - pnpm --filter backend run check:storefront-indexability
    # `specs/098-storefront-ssr-seo-a11y-suite/` Phase 3, FR-020…FR-022 — a
    # client component does not fetch its own first-paint content. A render
    # gated on state a `useEffect` populates is a component that sends a
    # skeleton, an empty list or a `null` to a crawler, because the effect that
    # would replace it never runs on the server.
    # Its population is derived and that is the whole difference: the storefront
    # application **and** every workspace package the storefront composes, taken
    # from `storefront/package.json`'s own dependencies. All five known
    # instances of the defect live in `packages/cms-components/`, so the
    # roadmap's `storefront/components` population would have reported zero and
    # been wrong on the day it landed (FR-021).
    - pnpm --filter backend run check:rsc-discipline
    # Feature 021 / Principle VIII (issue #116) — a user-visible string in the
    # admin SPA is a translation key, not a literal. `AGENTS.md` has cited this
    # script as the gate since 021 and it ran in no job at all: first because its
    # default root resolved against the working directory and read zero files,
    # then because fixing that surfaced 274 findings across 47 screens. It runs
    # against HARDCODED_STRINGS_BASELINE, a two-way per-file ratchet — a new
    # string fails, and so does a number left standing after the strings under it
    # were translated.
    - pnpm --filter backend run i18n:hardcoded
    # Constitution IV — pdfmake's bundled fonts set the single-VPS disk floor.
    # Also in no job until issue #116, on the stated grounds that it needs an
    # installed node_modules — which this job has had all along, in
    # `before_script`. It measures a real directory or exits 2; it never reports
    # a budget it did not measure.
    - pnpm run check:pdfmake-footprint
    # Feature 057 (FR-006/SC-003) — the manifest index + divergence report
    # regenerate deterministically for the bare-core build; `overlay:check`
    # regenerates and fails on ANY drift (identical inputs ⇒ identical artifact).
    # Per-deployment builds add `DEPLOYMENT=<name>` and run this same check plus
    # the DB-backed suite (see the overlay matrix note above `test:backend`).
    - pnpm --filter backend run overlay:check
    # `specs/107-override-report-and-ladder/contracts/divergence-report.md` §4–§5
    # (D-30) — a deployment's divergence from core is derived, owned and
    # explained. A check of its own rather than an arm of `overlay:check`,
    # because these are not determinism questions: that gate renders each
    # artefact and byte-compares, and **two renders of a wrong derivation
    # agree**. A report can be perfectly deterministic and record a decoration
    # nobody explained, name a registration no module registers, or target an
    # endpoint no route serves. Same reasoning D-155.6 used to add the `foreign`
    # verdict rather than trust the other three.
    # Nine findings, four refusals of its own and three delegated to the shared
    # helpers that own them. **No ledger, deliberately**: every finding is a file
    # the deployment owns and one edit from compliance, so an entry could only
    # license the thing the report exists to surface. It lands empty — the
    # merge request that adds it writes `example`'s three reasons and
    # `acceptance`'s one.
    - pnpm --filter backend run check:divergence
    # Feature 080 (T043) — the release-intent gate below cannot silently stop
    # asking. `release:changeset` is the changesets CLI's own command, so there
    # is nothing of ours in it to keep correct — and that was the stated reason
    # it needed no check, which is backwards: the CLI is right, and what decides
    # whether it is *looking* is `.changeset/config.json`. Measured, with a
    # branch that changes `packages/` and carries no changeset: at
    # `privatePackages.version: true` the gate exits 1, at `false` — the
    # `@changesets/config@4` default — it exits 0 with an empty release plan,
    # and with the block deleted it exits 0 too. Four lines of apparent
    # boilerplate, and nothing in the tree read them. It runs HERE rather than
    # in `release:changeset` deliberately: `quality` has no `changes:` filter,
    # so it also runs on the merge request whose only diff is that file, which
    # matches no rung of `.backend-test-rules`.
    - pnpm --filter backend run check:release-intent
    # D-160.8 — a module reaches the platform only through what the platform
    # publishes. `host-package.md` §1 classifies all 53 platform files a module
    # reaches as published API, accidental reach or should-be-a-port, three
    # delivered rows build on that classification, and nothing enforced it:
    # `check:module-boundary` is module→module, `check:kernel-boundary` is ORM
    # relations, and the `exports` map enforces nothing for the modules still in
    # `backend/src`, which is all of them. The verdict is per **symbol** of a
    # named file — !883 measured sixteen symbols of published files that no
    # module takes and that are deliberately unpublished — and it is read out of
    # the directory barrels, the same source `published-surface.test.ts` holds to
    # §1.3, so the two cannot disagree.
    # `UNPUBLISHED_PLATFORM_REACHES` is a two-way draining ledger over the
    # reaches standing today; every entry names the paragraph that classified it
    # and the event that retires it.
    - pnpm --filter backend run check:platform-surface
    # Feature 080 (T041) — every module package's `package.json` is generated
    # from its layer inventory, and this is the two-way gate over the 70 of them
    # plus `admin/package.json`'s dependency block. It ran in **no job at all**
    # until this line: `grep -c 'manifests:check' .gitlab-ci.yml` was 0, and on
    # 2026-09-05 it was red on `master` with 70 stale manifests after a release
    # commit set versions by hand. A developer running it locally found that; no
    # pipeline said a word. That is issue #113's shape one level up — not a
    # green that means "not looking", but a gate nobody runs.
    #
    # It belongs HERE rather than in `test:backend`. It reads files and refuses,
    # it reaches no service, and it is not a test — but the deciding half is
    # that `quality` has no `changes:` filter, while `.backend-test-rules` is a
    # rung ladder and the diff that produced the defect was
    # `packages/*/package.json` and nothing else. A gate placed where the diff
    # that breaks it does not run it is a gate that will be silent exactly when
    # it matters.
    #
    # It imports every module package's manifest, so it needs `build:packages`
    # — which this job's `before_script` already has, and which
    # `test/unit/ci/toolchain-supply.test.ts` holds it to. `--check` never
    # writes: a CI job that repaired the tree it is checking would report green
    # on a commit nobody can reproduce. Measured at 8 s on a developer machine,
    # twice.
    #
    # `test/unit/ci/gate-coverage.test.ts` is what stops the next one being
    # forgotten: it derives every script in the workspace that runs a repository
    # script file, asks whether any job reaches it, and fails on one that is
    # neither run nor classified.
    - pnpm --filter backend run manifests:check
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ---------------------------------------------------------------------------
# Static conventions — Principle VI (naming) and Principle VIII (English
# working language). Pure bash/grep/perl/awk over the checked-out tree, so it
# needs no `pnpm install` and reports in seconds, independently of whether the
# node toolchain builds at all. Kept as its own job for exactly that reason.
#
# Runs in full-tree mode, matching `pnpm run check:naming` / `check:language`
# locally. The scripts' `--diff` mode is deliberately NOT used here: GitLab
# clones shallow by default, so `origin/master` is usually absent and --diff
# would silently degrade to a full scan anyway.
#
# Image notes — debian:bookworm-slim already ships perl, mawk and a
# PCRE-enabled grep (both scripts are written to POSIX awk for mawk, and treat
# `file` as optional). Only git is missing, and it is load-bearing: the file
# list comes from `git ls-files`, so both scripts hard-fail with exit 2 when
# git is absent rather than passing vacuously over an empty list.
# ---------------------------------------------------------------------------
quality:static:
  stage: quality
  image: debian:bookworm-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    # Run both and fail at the end, so one MR round-trip reports every finding
    # instead of hiding the language check behind a naming failure.
    - status=0
    - bash scripts/check-naming.sh || status=1
    - bash scripts/check-language.sh || status=1
    - exit $status
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ---------------------------------------------------------------------------
# Release intent — a merge request that changes a workspace package under
# `packages/` must say what it means for the people who consume that package
# (D-107). `changeset status --since=<ref>` is the changesets CLI's own answer
# to that question, so there is no script of ours here to keep correct.
#
# It is a merge-request gate only. On the default branch the comparison is the
# branch against itself: no changed packages, so a pass there would measure
# nothing.
#
# Two things this job has to get right, because both fail silently otherwise:
#
#   1. The base ref must exist. GitLab clones shallow, so `origin/master` is
#      usually absent — and `changeset status` against a ref it cannot resolve
#      is not a pass, it is a question nobody asked. GIT_DEPTH: 0 plus an
#      explicit fetch gets the ref; the guard below exits 2 when it still is
#      not there, matching the repository's rule that a green may never mean
#      "did not look".
#   2. `git` is load-bearing and node:22.17-slim does not ship it — same
#      reasoning as quality:static above.
#
# What it does NOT check, stated so nobody reads more into a green: the CLI
# asks "did any versionable package change while the branch carries zero
# changesets", not "is there a changeset for each package that changed". A
# branch touching two packages satisfies it with one file. Reviewers close
# that gap; the gate closes the one that is mechanical. Nor can it see the
# config it runs under — `check:release-intent` in the `quality` job does that,
# and a `privatePackages.version` of `false` makes the command below exit 0
# over a branch that changed a package and carries no changeset.
#
# **And it decides "which package changed" by directory**, which is right only
# while a package's sources are its own directory. `@endora-commerce/platform`
# compiles `backend/src`, so the CLI reports nothing for a commit editing the
# code it publishes and reports a violation for one editing its README — the
# gate inverted with respect to what it protects (D-162). The second command
# below closes that edge, deriving each versionable package's real sources from
# its own `tsconfig.build.json`. It runs here rather than in `quality` because
# it needs a diff, and this is the job that has git and the target branch.
#
# **A release branch is the one branch this gate would otherwise refuse for
# doing its job.** `pnpm run version:packages` consumes the pending changesets,
# so the resulting merge request changes every bumped `packages/*/package.json`
# and carries zero changeset files — which is, to the CLI, precisely the shape
# it exists to fail. Measured: exit 1, "Some packages have been changed but no
# changesets were found". The discriminator below is the **diff**, not a branch
# name: a branch that deletes changeset files and adds none has consumed them,
# and nothing else in this repository does that. On such a branch the question
# is inverted rather than skipped — a release that bumped no version is the
# `changeset version` no-op arriving through the other door, and it is refused
# here for the same reason `version-packages.mjs` refuses it locally.
# ---------------------------------------------------------------------------
release:changeset:
  stage: quality
  image: node:22.17-slim
  variables:
    # Full history: `changeset status` diffs against the merge base, which a
    # shallow clone does not contain.
    GIT_DEPTH: 0
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - corepack enable && corepack prepare pnpm@9.15.0 --activate
    - pnpm install --frozen-lockfile
    # This job used to be the one node job without a build, on the ground —
    # written in the header above — that it "imports no `@endora-commerce/*`
    # package". That stopped being true when `check:release-intent` and
    # `test:release-gate` were added to the script below, and nothing noticed,
    # because the exception was a sentence rather than a predicate: the job went
    # red with `Failed to load url ../../../packages/platform/dist/tenancy/
    # tenant-context.js`. `test/unit/ci/toolchain-supply.test.ts` is the
    # predicate now — a job that runs a workspace script and does not build
    # first fails there, by name.
    - pnpm run build:packages
  script:
    - |
      base="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}"
      git fetch --quiet --no-tags origin "+refs/heads/$base:refs/remotes/origin/$base" || true
      if ! git rev-parse --verify --quiet "origin/$base^{commit}" > /dev/null; then
        echo "release:changeset — cannot resolve origin/$base; refusing to report a pass measured against nothing." >&2
        exit 2
      fi
      if ! git merge-base "origin/$base" HEAD > /dev/null 2>&1; then
        echo "release:changeset — no merge base between HEAD and origin/$base; refusing to report a pass measured against nothing." >&2
        exit 2
      fi
      consumed=$(git diff --no-renames --diff-filter=D --name-only "origin/$base...HEAD" -- '.changeset/*.md' | grep -viE '/readme\.md$' || true)
      written=$(git diff --no-renames --diff-filter=A --name-only "origin/$base...HEAD" -- '.changeset/*.md' | grep -viE '/readme\.md$' || true)
      if [ -n "$consumed" ] && [ -z "$written" ]; then
        echo "release:changeset — this branch deletes changeset files and adds none, so it is a release branch; asking whether it released anything instead."
        echo "$consumed" | sed 's/^/  consumed: /'
        if git diff -U0 "origin/$base...HEAD" -- '*/package.json' | grep -qE '^\+[[:space:]]*"version"[[:space:]]*:'; then
          git diff -U0 "origin/$base...HEAD" -- '*/package.json' | grep -E '^\+[[:space:]]*"version"[[:space:]]*:' | sed 's/^/  released: /'
          exit 0
        fi
        echo "release:changeset — it consumed the changesets above and moved no package version. That is what \`changeset version\` does when \`.changeset/config.json\` cannot see the packages: it exits 0, reports success and bumps nothing. Run \`pnpm --filter backend run check:release-intent\`." >&2
        exit 1
      fi
      pnpm exec changeset status --since="origin/$base"
      # D-162 — the edge the command above structurally cannot see. It
      # attributes a changed file to a package by the package **directory**,
      # and `@endora-commerce/platform` compiles `backend/src`, which is in
      # `ignore`. So the gate waives a changeset for the files that reach a
      # consumer and demands one for the files that do not. The population is
      # derived from each versionable package's own `tsconfig.build.json`;
      # this mode lives here rather than in `quality` because it needs git.
      pnpm --filter backend run check:release-intent -- --since "origin/$base"
    # Feature 080 (T043) — the gate above, measured over real branches, against
    # a real target branch. `node:22.17-slim` ships no git, so this job installs
    # it, as `test:backend:unit` does; the release-branch discriminator IS a
    # `git diff`, so the fake `git ls-files` in
    # `test/helpers/shell-check-fixture.ts` would prove only the fake. It
    # reaches no service, which is why this job still needs no containers — but
    # it does import repository code, so it builds the packages like every other
    # node job. `check-release-intent.test.ts` fails in the unit suite if this
    # line goes away, so the file cannot become one nothing runs.
    - pnpm --filter backend run test:release-gate
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ---------------------------------------------------------------------------
# Test — split three ways, to keep MR wall-clock low while staying a required
# gate: the DB-backed backend suite (sharded, `test:backend`), the service-less
# backend unit run (`test:backend:unit`, issue #211) and the frontend/contract
# suites. This is now the only CI that runs the suite: the GitHub
# Actions workflows were removed (the project delivers through GitLab MRs).
# ---------------------------------------------------------------------------

# When a change needs the backend suite run against it — shared by both backend
# test jobs, because two copies of this ladder would drift.
#
# The rungs are evaluated in order and the first match decides. The ladder is
# built so that the ONLY way to skip is a diff that is *provably* documentation.
# A diff the matcher does not recognise runs the tests; that is rung 3, and it
# is what stops a future refactor of rung 1 from turning "the matcher broke"
# into "nothing needed testing".
.backend-unit-test-rules:
  # The service-free unit suite, and it **keeps its merge-request rung** while
  # the migration narrows the two heavy jobs above to the default branch
  # (D-198). It shared `.backend-test-rules` until 2026-09-03, so narrowing that
  # anchor silently took this job with it — caught before the change shipped,
  # and the reason it now has an anchor of its own rather than a comment asking
  # the next editor to remember.
  #
  # It earns the merge-request run on three properties the sharded suite lacks:
  # it declares `BACKEND_TEST_SERVICES=none` and provisions no container, it
  # finishes in minutes, and it names the failing test. That last one is the
  # whole point of keeping *something* on a branch — with fifteen merge requests
  # landing in a batch, a red default branch has fifteen candidates.
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - packages/**/*
        - pnpm-lock.yaml
        - tsconfig.base.json
        - .gitlab-ci.yml
        - .changeset/config.json
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - docs/**/*
        - specs/**/*
        - '**/*.md'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.backend-test-rules:
  # ---------------------------------------------------------------------------
  # **Default branch only, for the duration of the packaging migration** (owner
  # ruling D-198, 2026-09-03). Restore the `|| $CI_PIPELINE_SOURCE ==
  # "merge_request_event"` clause on rungs 1 and 2 when the migration closes —
  # the ruling names the condition, and this comment is the reminder that it is
  # a suspension and not a design.
  #
  # **Why.** This suite is five shards that *serialise* (`resource_group:
  # backend-suite`, issue #199) on a runner shared with another project, so a
  # merge-request run costs hours. At the migration's merge cadence — fifteen
  # merge requests landed on 2026-09-03 alone — that signal arrives after the
  # branch it describes is already merged.
  #
  # **What is kept, and why those.** `quality`, `quality:static` and
  # `test:backend:unit` still run on every merge request: minutes, no service
  # containers, and each names the file and the rule it refuses. That is the
  # property master-only cannot reproduce — with fifteen merges in a batch, a
  # red `master` has fifteen candidates, and establishing whose a number was
  # cost a full day of work on 2026-09-03 (`RECORDED_READ_SIZES`, 31 entries,
  # attributed by standing a second worktree at a month-old commit).
  #
  # **What is given up, stated rather than discovered.** An integration or
  # contract regression is now found on `master`, after the merge, by whoever
  # runs next. AGENTS.md already records that shape three times over — a
  # contract test red across 29 merges, an integration test red across 50. This
  # ruling accepts it for the migration window in exchange for the runner, and
  # the `master` pipeline is what bounds it.
  # ---------------------------------------------------------------------------
  rules:
    # 1 — something that can affect the backend changed. On the default branch
    #     this is what gets deployed.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - backend/**/*
        - packages/**/*
        - pnpm-lock.yaml
        - tsconfig.base.json
        - .gitlab-ci.yml
        # Feature 080 (T043) — `test/unit/release/changeset-flow.test.ts` spawns
        # the real changesets CLI over this repository's own manifests and this
        # file, and it is the only thing that measures what the release flow
        # does rather than what its config says. Without this entry an MR whose
        # only diff is `.changeset/config.json` matches no rung: not rung 1, and
        # not rung 2 either, since it is not `*.md`. The changeset *files* are
        # deliberately not here — a documentation MR carrying one empty
        # changeset would otherwise pull in the whole backend suite.
        - .changeset/config.json
    # 2 — nothing on that list changed and the diff IS documentation. Ten of the
    #     last sixty merges to master touched nothing outside `docs/`, `specs/`
    #     and `*.md`, and each one ran the whole backend suite. This skips them
    #     because they were classified, not because no pattern happened to hit.
    #     A `*.md` under a code path (e.g. `backend/src/modules/*/README.md`)
    #     never reaches this rung — rung 1 already matched it.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - docs/**/*
        - specs/**/*
        - '**/*.md'
      when: never
    # 3 — the default branch with a diff neither list recognises: a new
    #     top-level directory, or a push GitLab could not diff. Run.
    #
    #     There is deliberately no rung 3 for merge requests: an MR that touches
    #     only `admin/` or `storefront/` has never run the backend suite, and
    #     making it do so would add ~25 minutes to the commonest kind of
    #     frontend MR. That case is still "skipped because nothing matched"
    #     rather than "skipped because classified" — narrowing it is a separate
    #     change with its own cost, not a side effect of the docs filter.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Overlay per-deployment coverage (feature 057, FR-010; issue #210).
#
# The bare-core build is the sharded `test:backend` job below (DEPLOYMENT unset)
# and it stays the baseline: a red bare-core run blocks everything. Each client
# deployment gets its own instance that sets `DEPLOYMENT=<name>`, so a red
# deployment run blocks only that deployment.
#
# **Until issue #210 no CI job had ever set `DEPLOYMENT`**, which is why a
# `backend.ts`-only overlay module could crash composition, the one reference
# overlay module could ship an ungated route, and `manifest-index.generated.ts`
# could be permanently stale under the variable — all with a green pipeline. The
# comment that stood here said "No overlay deployments exist yet"; feature 057
# landed `backend/src/apps/example/` and the sentence was false from that day.
#
# It is a **separate job rather than a `parallel: matrix:` entry on the sharded
# one**, and the choice is a cost decision: a matrix entry multiplies all five
# shards by every deployment (5 → 10 jobs, ten service containers) on a 4 vCPU /
# 8 GB runner with concurrent=2, to re-run ~2000 tests that are identical between
# the two compositions. What a deployment build can break that bare core cannot
# is the composition itself — discovery, gating, decoration, ownership,
# permissions — so this job runs the suites that exercise it, unsharded, in one
# instance. Widen the selection when a deployment ships something core does not.
test:backend:deployment:
  stage: test
  image: node:22.17-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
    - name: getmeili/meilisearch:v1.11
      alias: meilisearch
  parallel:
    matrix:
      - DEPLOYMENT: [example]
  variables:
    NODE_OPTIONS: --max-old-space-size=2048
    POSTGRES_USER: b2b
    POSTGRES_PASSWORD: b2b
    POSTGRES_DB: b2b
    MEILI_MASTER_KEY: devMasterKeyChangeMe
    MEILI_ENV: development
    MEILI_NO_ANALYTICS: 'true'
    TEST_DATABASE_URL: postgresql://b2b:b2b@postgres:5432/b2b_test
    REDIS_URL: redis://redis:6379
    MEILISEARCH_URL: http://meilisearch:7700
    MEILISEARCH_API_KEY: devMasterKeyChangeMe
  before_script:
    - corepack enable && corepack prepare pnpm@9.15.0 --activate
    - pnpm install --frozen-lockfile
    - pnpm run build:packages
  script:
    # The artefacts must be deterministic with the variable set — that is the
    # half of issue #120's ruling this family never had.
    - pnpm --filter backend run overlay:check
    # The permission inventory is deployment-resolved on both sides, so this
    # instance sweeps the deployment's codes (feature 057, FR-009).
    - pnpm --filter backend exec vitest run test/overlay test/integration/overlay test/contract/admin_users/permission-inventory.test.ts
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  rules:
    # **Default branch only for the duration of the packaging migration**
    # (D-198, 2026-09-03) — restore the merge-request rung when it closes. This
    # job composes each deployment's overlay modules and boots them, which is
    # the composition that bare core cannot break; nothing about that judgement
    # changed, only when it runs. See `.backend-test-rules` above for the full
    # reasoning and for what is given up.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - backend/**/*
        - packages/**/*
        - pnpm-lock.yaml
        - tsconfig.base.json
        - .gitlab-ci.yml

# The fast `overlay:check` (determinism + resolver guards) also runs for every
# push in the `quality` stage above, bare core.
#
#
# Backend: ~2000 DB-backed tests, run SERIALLY per process (vitest singleFork).
# Sharded across `parallel` job instances — each instance gets its OWN
# postgres/redis/meilisearch services, and `vitest --shard` splits the test files
# between them.
#
# Memory: ONE SHARD AT A TIME while this runner is shared, which is what
# `resource_group` below is for (issue #199, second cause). This block used to
# say the shard's own retained heap was the wall — "~10 MB per test file, past
# 1.5 GB at ~130 files" — and to offer two levers, more shards and a bigger
# `--max-old-space-size`. Every part of that was measured on the runner and none
# of it survived.
#
# **The shard does not climb.** Peak fork RSS is reached at file ~40 of 269 and
# is flat for the remaining 229: 1.86 GB at the 2048 cap. `heapUsed` peaks near
# 700 MB against a 2 GB old-space, so the V8 cap is never approached and
# `test/heap-headroom.ts` never warns. More shards therefore buy nothing — a
# 40-file shard reaches the same peak — and the per-file leak !915 left unplugged
# is not measurable across a full shard.
#
# **What kills it is the host, and the host is shared.** The job container has no
# memory limit of its own (`memory.max: max`), and after a failure its cgroup
# reports `oom 0, oom_kill 1` — a process of this cgroup killed by an OOM killer
# that was not this cgroup's own limit. Run ALONE the same shard completes all
# 269 files with `oom_kill 0` and leaves the host 3.7 GB free; run as a
# concurrent pair the host's MemAvailable collapses from 3.7 GB to under 500 MB
# and returns the instant the fork dies. Two things share this machine with the
# suite: `endora-commerce-runner-1` and `-2` are two registrations on ONE box
# (same `system ID`, same docker host in both job logs), 4 vCPU and MemTotal
# 7 926 360 kB — and that box also carries another project's live Magento 2 test
# server. A neighbour with a large and *variable* footprint is why the failure
# was nondeterministic: shard 4 is simply the largest fork at the moment the host
# runs out (1730 MB at file 40, against 1668, 1627, 1609 and 1501 for the other
# four), so it is the one the kernel picks.
#
# **`resource_group` is necessary and, on this box, not sufficient — and that
# retired a sentence that stood here.** It read "`--max-old-space-size=2048`
# stays. Serialised there is no contention for it to relieve", and it was a
# reasonable inference the very next pipeline refuted: with the shards
# serialised, shard 4 still died, at file 251 of 269, with `oom_kill 1`. The
# inference was wrong because `resource_group` serialises *this project's* jobs
# and can see nothing else on the machine — not the second registration taking
# another project's work, and not the neighbour. It is kept anyway: it took shard
# 4 from 40 of 269 files to 251, and the cost is stated where it will be
# questioned — the five shards serialise, so this stage goes from three waves
# (~75 min) to five runs (~120 min). Reconsider it when the runner is no longer
# shared; do not delete it now to make the pipeline faster.
#
# **What one job actually costs, which is the figure to size a machine against.**
# Measured across a whole 269-file shard, every container of the job read from
# its own cgroup (`anon`, because page cache is reclaimable under pressure and
# anonymous memory is not):
#
#     job container   2396 MB      services  202 MB      WHOLE JOB  2521 MB
#                                  (postgres 51, redis 15, meilisearch 183)
#
# The services are worth stating because they are easy to over-estimate: their
# `docker stats` figure is 737 MB, but 535 MB of that is reclaimable page cache.
# On a dedicated 8 GB machine (~7.7 GB usable) two concurrent jobs are 5.0 GB
# plus the OS, docker and the runner — it fits with about 2 GB to spare, so the
# concurrency should come back, driven from the runner's own `concurrent`
# setting rather than from here: the constraint is physical memory, which is a
# property of the machine and not of this repository.
#
# **`--max-old-space-size=2048` stays, and now for a measured reason rather than
# the inference above.** 1024 was measured over the same full shard, back to
# back: it saves 429 MB of the job's 2521 (17%), costs 14% of the wall clock
# (2319 s -> 2643 s), and takes the files lost to the 30 s `hookTimeout` from one
# to three — `setupBackendServer` boots the whole platform in a `beforeAll`, and
# a heap that collects harder boots slower. A cap that turns green files red is
# not a saving. What 2048 is FOR is unchanged and is not the host: it is what
# makes a genuine heap exhaustion arrive as a named error instead of a SIGKILL,
# and with a live set near 600 MB it leaves the headroom guard's 80% warning line
# (1638 MB) a wide margin that 1024 would cut to ~220 MB.
test:backend:
  stage: test
  image: node:22.17-slim
  parallel: 5
  # One shard at a time while the runner host is shared — see the Memory block
  # above. It is not a performance oversight; reconsider it when the suite has a
  # machine to itself, and drive the concurrency from the runner's `concurrent`
  # setting rather than from here.
  resource_group: backend-suite
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
    - name: getmeili/meilisearch:v1.11
      alias: meilisearch
  variables:
    # Per-shard V8 heap cap — see the "Memory" note above the job. It is not
    # what keeps this job inside the host (`resource_group` is); it is what
    # makes a genuine heap exhaustion arrive as a named error rather than as a
    # SIGKILL. Measured peak live set: ~600 MB. 1024 was measured and rejected
    # there, with the numbers.
    NODE_OPTIONS: --max-old-space-size=2048
    POSTGRES_USER: b2b
    POSTGRES_PASSWORD: b2b
    POSTGRES_DB: b2b
    MEILI_MASTER_KEY: devMasterKeyChangeMe
    MEILI_ENV: development
    MEILI_NO_ANALYTICS: 'true'
    # The **base** name: global-setup.ts derives the migrated template
    # (b2b_test_tpl) and this shard's own database (b2b_test_r_…) from it, and
    # migrates the template (issue #189). The postgres service container starts
    # empty on every pipeline, so this is still a genuine from-scratch
    # application of the whole chain in the order `src/db/migration-order.ts`
    # computes — which is the only thing covering the open block, whose
    # migrations are ordered by the module dependency graph rather than by
    # chronology (feature 081, SC-004); the shard then runs against a clone of
    # what those migrations built, and a separate migration:up step stays
    # redundant. Do not point this at a pre-migrated database. GitLab's docker
    # executor reaches services by their alias host (postgres), NOT 127.0.0.1 —
    # without this, tests fall back to localhost and ECONNREFUSED.
    TEST_DATABASE_URL: postgresql://b2b:b2b@postgres:5432/b2b_test
    REDIS_URL: redis://redis:6379
    MEILISEARCH_URL: http://meilisearch:7700
    MEILISEARCH_API_KEY: devMasterKeyChangeMe
  before_script:
    # This suite includes `test/unit`, so it has the same git dependency as
    # `test:backend:unit` below — see the note above that job.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - corepack enable && corepack prepare pnpm@9.15.0 --activate
    - pnpm install --frozen-lockfile
    - pnpm run build:packages
  script:
    # `exec vitest` (not `run test --`) — pnpm leaks the literal `--` into the
    # script args, which makes vitest ignore --shard and run the whole suite.
    - pnpm --filter backend exec vitest run --shard=$CI_NODE_INDEX/$CI_NODE_TOTAL
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  rules: !reference [.backend-test-rules, rules]

# The fast half of the backend suite (issue #211). `test/unit` is 315 files and
# only 16 of them talk to a live service, yet the whole directory used to be
# gated behind a globalSetup that creates and migrates a database — so the other
# 299 could not run without three service containers.
#
# `vitest.unit.config.ts` excludes those 16 (named with a reason each in
# `backend/test/service-dependent-unit-tests.ts`) and declares
# BACKEND_TEST_SERVICES=none, which is why this job has NO `services:` block.
# That absence is the point: if a service-dependent test ever lands in this run,
# the harness refuses at its seam with a sentence naming the ledger, rather than
# quietly passing against nothing.
#
# The 16 excluded files still run in `test:backend` above, so this is a split of
# jobs, not of coverage. `needs: []` starts the job at pipeline creation instead
# of after the `quality` stage — the whole value here is an answer in minutes.
# `git` is a dependency of this suite, and it took a day to find out because
# nothing said so. `node:22.17-slim` ships none, and the suite spawns it three
# ways: `test/unit/release/changeset-flow.test.ts` runs the real changesets CLI
# (which shells out to git and exits 1 on `spawn git ENOENT`), and
# `test/unit/scripts/check-read-size.test.ts` spawns `check-naming.sh` and
# `check-language.sh` over the real tree, whose file list is `git ls-files` —
# both exit 2 without it rather than report a verdict over a list they could not
# get. Ten of the resulting failures read `expected 1 to be 0` and none of them
# mentioned git. `test/unit/ci/toolchain.test.ts` is the one that does now: it
# fails first, in one sentence, if this line is ever dropped.
#
# The fixture runs in `shell-checks.test.ts` fake git on `PATH`
# (`test/helpers/shell-check-fixture.ts`) and are unaffected either way — that
# fake is not evidence the suite needs no git, which is how this went unnoticed.
test:backend:unit:
  stage: test
  image: node:22.17-slim
  needs: []
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - corepack enable && corepack prepare pnpm@9.15.0 --activate
    - pnpm install --frozen-lockfile
    - pnpm run build:packages
  script:
    - pnpm --filter backend run test:unit:fast
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  rules: !reference [.backend-unit-test-rules, rules]

# ---------------------------------------------------------------------------
# The acceptance criterion for "a package can ship schema" (feature 080, D-110).
#
# It builds a synthetic third-party module into a tarball, installs it into a
# throwaway directory OUTSIDE the checkout, and asks this platform whether the
# package's entity and migration reached a real PostgreSQL database. The whole
# point is to leave the monorepo: a moved directory is still inside the walked
# tree, still inside relative-specifier range, and pnpm links a workspace member
# into `node_modules` — so every rehearsal that stays inside passes and proves
# nothing (contract `specs/080-f4-real-scope/contracts/package-schema-acceptance.md`).
#
# **It exists as a job because a criterion nobody runs is the failure this file
# already made once**: the `DEPLOYMENT` matrix was described in a comment for
# two features and added by nobody, so a `backend.ts`-only overlay module could
# crash composition with a green pipeline (see `test:backend:deployment`). The
# trigger list below is therefore the set of inputs that can change the answer,
# not a guess: the composer that emits both registries, the registries
# themselves, the migration order, the packaging manifests, the criterion's own
# sources, and the lockfile/workspace files that decide how anything resolves.
#
# **Red today, and enforced as a ratchet rather than as a failure.** A package
# genuinely cannot ship schema until Wave 3 lands, so seven of the nine
# assertions fail. `--against-expectation` compares the run to
# `backend/acceptance/expected-state.json` and fails on drift in EITHER
# direction — a newly-red A8 fails, and so does a newly-green A1 that nobody
# recorded. Failing on the red instead would block every merge request that adds
# a migration, and an `allow_failure: true` would be a job whose colour nobody
# reads. When Wave 3 lands, that file becomes all-`pass` in the merge request
# that earns it and this job becomes an ordinary regression gate.
#
# All three services are here although today's run only reaches PostgreSQL: the
# two lifecycle assertions compose the whole application, and the first merge
# request that makes them reachable must not also have to discover that this job
# cannot boot one.
# ---------------------------------------------------------------------------
acceptance:package-schema:
  stage: test
  image: node:22.17-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
    - name: getmeili/meilisearch:v1.11
      alias: meilisearch
  variables:
    POSTGRES_USER: b2b
    POSTGRES_PASSWORD: b2b
    POSTGRES_DB: b2b
    MEILI_MASTER_KEY: devMasterKeyChangeMe
    MEILI_ENV: development
    MEILI_NO_ANALYTICS: 'true'
    # The runner DROPS and re-creates this database on every run, so its name
    # must satisfy the disposable-name convention `(^|_)test(_|$)` — the same
    # judgement `test/global-setup.ts` and the dev-seed guard make. It refuses
    # to touch anything else, which is what keeps a mistyped DSN from being a
    # data-loss incident.
    ACCEPTANCE_DATABASE_URL: postgresql://b2b:b2b@postgres:5432/b2b_acceptance_test
    REDIS_URL: redis://redis:6379
    MEILISEARCH_URL: http://meilisearch:7700
    MEILISEARCH_API_KEY: devMasterKeyChangeMe
    PUBLIC_API_BASE_URL: http://localhost:3001
  before_script:
    - corepack enable && corepack prepare pnpm@9.15.0 --activate
    - pnpm install --frozen-lockfile
    - pnpm run build:packages
  script:
    - pnpm --filter backend run acceptance:package-schema:ci
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        # The composer emits both registries; a change to its walk, its
        # `@Entity(` probe or its specifier rule is a change to the answer.
        - backend/scripts/generate-composer.ts
        - backend/src/db/migrations-registry.generated.ts
        - backend/src/db/entities-registry.generated.ts
        - backend/src/db/configured-migrations.ts
        # Execution order (feature 081): a package's chain slots in at its
        # module's topological position.
        - backend/src/db/migration-order.ts
        - backend/src/db/mikro-orm.config.ts
        # Packaging manifests — every `package.json` in the tree, plus the two
        # files that decide what pnpm considers a workspace member. A package
        # accidentally becoming one is precisely the trap A8 refuses.
        - '**/package.json'
        - pnpm-workspace.yaml
        - pnpm-lock.yaml
        # Discovery and composition: the seam a package plugs into.
        - backend/src/composition.ts
        - backend/src/overlay/**/*
        # The lifecycle subsystem: host-owned since feature 080's T040b
        # (D-160.11), so it is `src/lifecycle/` rather than a module directory,
        # and the manifest index it used to hold is at the source root
        # (D-160.3).
        - backend/src/lifecycle/**/*
        - backend/src/manifest-index.generated.ts
        - backend/src/manifest-locations.ts
        # The deployments themselves, not only the machinery that loads them.
        # `src/overlay/**` is the loader; `src/apps/**` is what it loads, and a
        # criterion that asserts a deployment's behaviour has to run when that
        # deployment changes. Found by feature 080's T053(c) (!967), which added
        # an assertion over a deployment and would not have run on a merge
        # request that edited only it — the job would have stayed green by not
        # being asked.
        - backend/src/apps/**/*
        # The criterion itself.
        - backend/acceptance/**/*
        - backend/scripts/acceptance/**/*
        - .gitlab-ci.yml

# Frontend + contracts: jsdom / pure-node, no external services. Cheap enough to
# run on every pipeline without sharding or scoping.
test:frontend:
  stage: test
  image: node:22.17-slim
  before_script:
    # `packages/cli`'s storefront-scaffold tests build a fixture **checkout**, because the
    # scaffold's copy population is `git ls-files` and a fixture that is not a repository
    # would test a different derivation. `node:22.17-slim` ships no git, so `spawnSync`
    # returns `status: null` and the failure reads `git init -q: undefined` — a message that
    # names neither git nor its absence. Four other jobs in this file install it for their
    # own reasons; this is the fifth.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - corepack enable && corepack prepare pnpm@9.15.0 --activate
    - pnpm install --frozen-lockfile
    - pnpm run build:packages
  script:
    - pnpm --filter '!backend' run test
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# The test kit's **service-bound** half (feature 109, Phase 1b).
#
# `test:frontend` above runs every non-backend member's `test` script in an
# image with no service containers, and the kit's own proofs need a real
# PostgreSQL and a real Redis: it composes a platform, leases a database and
# reads a tenant-filtered row back. That is the subject rather than the
# background — an in-memory substitute would make the kit installable with no
# services and would test a platform nobody runs (`plan.md` § Complexity
# Tracking) — so the files live in a second vitest configuration and this job is
# where they run.
#
# Two configurations rather than a condition inside one, for the reason issue
# #113 gives about every check in this pipeline: a condition is a green that can
# quietly become "not looking", and the failure would be invisible precisely
# because the kit is what every module package's server-bound test will compose
# through.
#
# No Meilisearch: the kit's fixture platform is two synthetic modules and one
# entity, and it composes no search.
test:kit:
  stage: test
  image: node:22.17-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_USER: b2b
    POSTGRES_PASSWORD: b2b
    POSTGRES_DB: b2b
    TEST_DATABASE_URL: postgresql://b2b:b2b@postgres:5432/b2b_test
    REDIS_URL: redis://redis:6379
  before_script:
    - corepack enable && corepack prepare pnpm@9.15.0 --activate
    - pnpm install --frozen-lockfile
    - pnpm run build:packages
  script:
    - pnpm --filter @endora-commerce/test-kit run test:services
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - packages/test-kit/**/*
        - packages/platform/**/*
        - packages/contracts/**/*
        - pnpm-lock.yaml
        - tsconfig.base.json
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ---------------------------------------------------------------------------
# Performance benchmarks (issue #143, ruling D-64). Deliberately NOT on a
# merge request.
#
# These assert p95 wall-clock. The shared runner is a 4 vCPU / 8 GB box with
# concurrent=2, and `test:backend` already fills it with 5 sharded jobs and
# their service containers (see the notes above that job). A p95 measured
# beside two live shards measures contention, so a per-MR gate here would be a
# coin toss that blocks merges — worse than not measuring at all.
#
# So: a scheduled pipeline, alone on the runner, blocking THAT pipeline. A red
# nightly is visible and costs nobody a merge. `when: manual` on an MR is for
# someone deliberately measuring a change they suspect.
#
# CI_SCHEDULE_KIND is set on the schedule itself (nightly / weekly-heavy).
# Two schedules are needed for this job to mean anything:
#   nightly       CI_SCHEDULE_KIND=nightly       — the nine fast benchmarks
#   weekly-heavy  CI_SCHEDULE_KIND=weekly-heavy  — plus the two multi-minute
#                                                  files
#
# The first three runs are RECORDING runs (D-65): every benchmark prints
# `p95=… (budget …)`, and each budget in `test/perf/**` is re-based from what
# those three runs measure on this runner. The defaults committed today come
# from four local runs × 3 and carry that derivation in a comment beside them;
# they are a starting point, not the enforced number.
perf:backend:
  stage: test
  image: node:22.17-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
    - name: getmeili/meilisearch:v1.11
      alias: meilisearch
  variables:
    NODE_OPTIONS: --max-old-space-size=2048
    POSTGRES_USER: b2b
    POSTGRES_PASSWORD: b2b
    POSTGRES_DB: b2b
    MEILI_MASTER_KEY: devMasterKeyChangeMe
    MEILI_ENV: development
    MEILI_NO_ANALYTICS: 'true'
    TEST_DATABASE_URL: postgresql://b2b:b2b@postgres:5432/b2b_test
    REDIS_URL: redis://redis:6379
    MEILISEARCH_URL: http://meilisearch:7700
    MEILISEARCH_API_KEY: devMasterKeyChangeMe
    PERF_RUN: 'true'
  before_script:
    - corepack enable && corepack prepare pnpm@9.15.0 --activate
    - pnpm install --frozen-lockfile
    - pnpm run build:packages
  script:
    # `test/perf/carts/abandonment-sweep.bench.ts` runs on both schedules again
    # (issue #152). It was excluded because it could not finish: the sweep did
    # one `em.find(CartItem)` and one flushing `CartAuditService.record()` per
    # eligible cart over an identity map that kept everything it had touched, so
    # 4× the carts cost 16× the time and the default corpus hit the 10-minute
    # vitest timeout before it could report a number. That is fixed; the sweep
    # batches, and 10 000 carts take ~5.3 s against a re-based 17 s budget. The
    # file's own header carries the before/after readings and the derivation.
    #
    # The two multi-minute files (100k feed generation, Ergonode import) run on
    # the weekly schedule only — a 10-minute budget has no place in a nightly.
    #
    # Written as shell variables rather than the folded `- >` block the ruling
    # sketched: inside a folded scalar YAML keeps the newline before a MORE
    # indented line, so a `--exclude` wrapped under its `pnpm` would have
    # reached bash as its own command. GitLab concatenates these lines into one
    # script, so the assignments carry.
    - SKIP_HEAVY="--exclude test/perf/product_feeds/generation-100k.test.ts --exclude test/perf/pim_ergonode/import-throughput.test.ts"
    - if [ "$CI_SCHEDULE_KIND" = "weekly-heavy" ]; then SKIP_HEAVY=""; fi
    - pnpm --filter backend exec vitest run test/perf $SKIP_HEAVY
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
  # Shared with `perf:storefront` and `conformance:storefront`, which run on the
  # same nightly schedule on the same 4 vCPU host (feature 098, T501). A p95
  # measured beside another job's `next build` measures that build; the header
  # above already says so about `test:backend`'s shards, and the schedule grew
  # two more heavy jobs since it was written.
  resource_group: perf-measurement

# ---------------------------------------------------------------------------
# The boot gate — the built image is booted, and asserted to be the platform the
# source describes (feature 080, D-165 step F).
#
# **This job is the condition of D-165, not a follow-up to it.** That ruling moves
# production off `tsx src/index.ts` and onto `node dist/index.js`, and two defects
# were *reproduced* on the half-built compiled path — not predicted:
#
#   * 45 of 45 modules installing no translations while the boot reported
#     `installed=0 skipped=21 failed=0`. Green.
#   * every overlay module vanishing, with no error and no warning.
#
# Nothing else in this pipeline can see either. `quality` type-checks the source
# tree; `test:backend` runs vitest against the source tree; `test:backend:deployment`
# composes overlays from the source tree. In every one of them the tree is the
# source tree, and both defects are properties of the *built* one. So the gate
# builds the image, migrates a throwaway database, boots it and asks the running
# platform three questions — see `scripts/boot-gate.sh`, which carries the whole
# reasoning.
#
# **It also runs itself red, in every pipeline.** `--with-negatives` derives two
# images from the one under test — one with every `.json`/`.txt` removed from the
# built tree (exactly a build without `copy-runtime-assets`), one with the
# deployment's overlay directory removed — boots each, and requires the matching
# finding. A boot gate that has never been red is a boot gate nobody has tested,
# and the first of those two is why the assertion is arithmetic rather than
# `installed > 0`: with the assets gone, the six modules that are packages carry
# their bundles inside `node_modules` and still install, so `installed=6` is a
# cheerful non-zero over a platform whose other 39 modules serve raw keys.
#
# **What it costs, stated so the scoping can be argued.** Three boots at ~25 s
# each plus the image build, which on this runner is the same build `build:backend`
# already does on the default branch. The rules below are `acceptance:package-schema`'s
# shape: always on the default branch, and on a merge request that touches anything
# the built image is made of. A merge request that changes only `admin/` or
# `storefront/` does not pay it.
#
# **dind, and no published port.** The application container runs inside the dind
# daemon, so a `-p` publish lands on the daemon's host and not on this job's — the
# gate therefore speaks HTTP from a throwaway container on its own docker network,
# using the image's own node. That is also why this job needs nothing installed:
# `docker:27` plus `bash`, and the gate's judgement is `scripts/lib/boot-gate-assert.sh`.
boot-gate:
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  variables:
    # Same plain-2375 arrangement as `.build-base` below; both sides must agree.
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
  before_script:
    # `docker:27` is alpine and ships `ash`. The gate is bash, like every other
    # shell script in this repository.
    - apk add --no-cache bash
  script:
    - bash scripts/boot-gate.sh --with-negatives
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        # What the image is built from.
        - backend/**/*
        - packages/**/*
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json
        - backend/Dockerfile
        - .dockerignore
        - scripts/collect-workspace-manifests.sh
        # The gate itself, and the compose file whose commands it mirrors.
        - scripts/boot-gate.sh
        - scripts/lib/boot-gate-assert.sh
        - deploy/compose.prod.yml
        - .gitlab-ci.yml

# ---------------------------------------------------------------------------
# Pack gate (feature 104) — every publishable package packs into a tarball a
# consumer can actually use.
#
# The only gate in this pipeline whose subject is a **tarball**. `quality`
# type-checks sources, `test:backend` runs vitest against sources,
# `overlay:check` renders generated files from sources — and every defect this
# gate refuses is invisible in a checkout by construction, because a workspace
# link resolves an `exports` subpath against the source directory and a
# `workspace:` range resolves against the workspace. It runs in `test` rather
# than `build` for the same reason `build:docs` does: a package that cannot be
# consumed has to fail the merge request that writes it, not the release that
# publishes it.
#
# It needs no registry credential and makes no network request: the packed
# binary is run with its declared dependencies **symlinked** out of this
# checkout, which is also what makes an undeclared runtime dependency a finding
# rather than an invisible one. See `backend/scripts/pack-gate.ts`.
pack-gate:
  stage: test
  image: node:22.17-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends tar
    - corepack enable && corepack prepare pnpm@9.15.0 --activate
    - pnpm install --frozen-lockfile
    # Every `@endora-commerce/*` specifier resolves at its built `./dist`, this
    # gate's own `tsx` entry point included — and `pnpm pack` packs what is on
    # disk, so an unbuilt workspace would produce 79 tarballs with no code in
    # them and the gate would report the run rather than the tree.
    - pnpm run build:packages
  script:
    # `--no-build` because `before_script` has already built: the gate builds
    # for itself when a developer runs it, and must not do it twice here.
    - pnpm --filter backend run pack-gate -- --no-build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        # What gets packed, and what decides how.
        - packages/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json
        # The gate itself and its judgement.
        - backend/scripts/pack-gate.ts
        - backend/scripts/lib/pack-assert.ts
        - .gitlab-ci.yml

# ---------------------------------------------------------------------------
# The acceptance criterion for `endora new storefront`
# (specs/071-modular-packaging/roadmap.md § F7 — Storefront scaffold).
#
# It scaffolds a storefront OUTSIDE this checkout, installs it from packed
# tarballs with no symlink back, `next build`s it, and boots the result against
# a backend this job starts. Every step exists to leave the monorepo, for
# `acceptance:package-schema`'s reason one surface over: a copy that stays
# inside is still inside relative-specifier range, still reached by the
# workspace globs, and pnpm links a workspace member into `node_modules` — so a
# rehearsal that stays inside passes and proves nothing.
#
# **Why it does not wait for publication.** Nothing under `packages/` is
# published, so the semver ranges the scaffold writes name versions no registry
# serves. `pnpm pack` rewrites a packed manifest's `workspace:` range to a
# version, and a `pnpm.overrides` block pins each tarball — which reaches the
# transitive edge too, `page-builder-core` depending on `contracts@0.0.0` being
# exactly as unpublished. Publication removes the overrides block and changes
# nothing else.
#
# **It boots a backend, and that is the point of A6 rather than an extravagance.**
# A `next start` with no backend serves the storefront's error page, and a
# criterion that called that a pass would be green over a storefront that renders
# nothing. The criterion records `unmeasured` — never a pass — when
# PUBLIC_API_BASE_URL names nothing, and the expectation file records A6 as
# `pass`, so a job that stopped booting one drifts and fails.
#
# It is not a `check-*` script and must not become one:
# `test/unit/scripts/check-read-size.test.ts` spawns every one of those, and an
# install plus a `next build` inside a unit run is not a test. Its judgement is
# `scripts/acceptance/storefront-scaffold-assertions.ts`, which touches no
# process and is unit tested over fixture text.
#
# **Two supply routes, and this job takes the first** (feature 104, § 1.6). The
# criterion installs either from tarballs packed out of this checkout and pinned
# through `pnpm.overrides`, or from a real registry through the `.npmrc`
# `endora new storefront --registry` writes. Which one is decided by
# ENDORA_NPM_REGISTRY in the environment and by nothing else — there is no flag —
# and that variable is protected, so a merge-request pipeline resolves it to
# nothing and this job measures the tarball route. That is deliberate rather
# than pending: the tarball route is the only one that works before the first
# publish, and it is what keeps the criterion green on a branch that publishes
# nothing. The registry route is recorded `unrun` in the expectation file until
# a run of it measures its six states; the run that does so drifts, which is
# what makes the record arrive from a measurement rather than from a prediction.
#
# A registry with no ENDORA_NPM_TOKEN is exit 2 and never an anonymous attempt:
# the endpoint answers an absent credential with 404, in the same sentence it
# gives for a package that was never published (feature 104 research §6), so the
# red it would produce says nothing about the criterion.
#
# `stage: test`, so it fails the merge request that breaks the scaffold rather
# than the default branch afterwards. The `changes:` list is the set of inputs
# that can change the answer: the command, the reference storefront, the
# packages a scaffolded storefront installs, the criterion itself, and the two
# files that decide how anything resolves.
# ---------------------------------------------------------------------------
acceptance:storefront-scaffold:
  stage: test
  image: node:22.17-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
    - name: getmeili/meilisearch:v1.11
      alias: meilisearch
  variables:
    POSTGRES_USER: b2b
    POSTGRES_PASSWORD: b2b
    POSTGRES_DB: b2b
    MEILI_MASTER_KEY: devMasterKeyChangeMe
    MEILI_ENV: development
    MEILI_NO_ANALYTICS: 'true'
    # The runner migrates this database from scratch on every run, so its name
    # satisfies the disposable-name convention `(^|_)test(_|$)` — the judgement
    # `test/global-setup.ts` and the dev-seed guard make, and what keeps a
    # mistyped DSN from being a data-loss incident.
    DATABASE_URL: postgresql://b2b:b2b@postgres:5432/b2b_storefront_acceptance_test
    REDIS_URL: redis://redis:6379
    MEILISEARCH_URL: http://meilisearch:7700
    MEILISEARCH_API_KEY: devMasterKeyChangeMe
    JWT_SECRET: storefront-acceptance-secret-not-a-real-one-000000
    NODE_ENV: development
    LOG_LEVEL: warn
    PUBLIC_API_BASE_URL: http://127.0.0.1:3001
  before_script:
    - corepack enable && corepack prepare pnpm@9.15.0 --activate
    # `git` because `endora new storefront` derives its copy population from `git ls-files`;
    # without it the scaffold exits 2 — *the run could not see the tree* — and this job
    # correctly reports that as neither a pass nor a failure of the criterion.
    - apt-get update -qq && apt-get install -y -qq postgresql-client curl git >/dev/null
    - pnpm install --frozen-lockfile
    - pnpm run build:packages
  script:
    - PGPASSWORD=b2b psql -h postgres -U b2b -d postgres -c "create database b2b_storefront_acceptance_test"
    - pnpm --filter backend exec tsx src/db/migrate.ts up
    # A6's subject. Backgrounded here rather than inside the criterion so that a
    # backend that will not boot is this job's failure, named as one, instead of
    # an assertion reporting that the storefront answered 500.
    - pnpm --filter backend exec tsx src/index.ts > /tmp/backend.log 2>&1 &
    - for i in $(seq 1 60); do curl -sf -o /dev/null "$PUBLIC_API_BASE_URL/api/v1/storefront/module-presence" && break || sleep 2; done
    - curl -s -o /dev/null -w '%{http_code}\n' "$PUBLIC_API_BASE_URL/api/v1/storefront/module-presence" || (tail -50 /tmp/backend.log && exit 1)
    - pnpm --filter backend run acceptance:storefront-scaffold:ci
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        # The command, and the derivation it runs.
        - packages/cli/src/new-storefront/**/*
        - packages/cli/src/bin/endora.ts
        # The subject: a declaration added to the reference storefront that
        # names something above its own directory is what this job refuses.
        - storefront/**/*
        # The packages a scaffolded storefront installs. Their `exports` maps
        # and `"use client"` boundaries are what an install that is not a
        # workspace link has to survive.
        - packages/contracts/**/*
        - packages/cms-components/**/*
        - packages/page-builder-core/**/*
        # The criterion itself, and its recorded expectation.
        - backend/scripts/acceptance/storefront-scaffold*.ts
        - backend/acceptance/storefront-scaffold-expected-state.json
        # How anything resolves at all.
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .gitlab-ci.yml

# ---------------------------------------------------------------------------
# Docs — build the Docusaurus site
# ---------------------------------------------------------------------------
#
# `specs/100-module-owned-documentation/` FR-014, and it is in Phase 1 rather
# than a follow-up because a generated sidebar that nothing builds is a
# generated file nobody validates.
#
# It is the acceptance instrument for two things no other job in this pipeline
# can see:
#
#   * Docusaurus's own `checkSidebarsDocIds` — a sidebar entry naming no page,
#     which throws *"These sidebar document ids do not exist"*
#     (`@docusaurus/plugin-content-docs/lib/sidebars/utils.js`);
#   * `onBrokenLinks: 'throw'` — a relative link to a page that moved. Phase 2
#     moves 78 pages and renames four slugs whose URLs are cited by other pages
#     and by specs, so this is what makes a rename reviewable.
#
# Measured before it existed: `.gitlab-ci.yml` declared `build:backend`,
# `build:storefront` and `build:admin` and no docs job, `.backend-test-rules`
# rung 2 skips the backend suite for a documentation-only diff (deliberately and
# correctly), and `pnpm -r run typecheck` does not read `sidebars.js` — its
# `// @ts-check` header is inert, because `@docusaurus/tsconfig` sets no
# `allowJs` and the file is in no program. So the one direction Docusaurus does
# enforce was enforced by a build that ran on a developer's machine and nowhere
# else.
#
# It is **not** a `check-*` script and must not become one:
# `test/unit/scripts/check-read-size.test.ts` spawns every one of those, and a
# Docusaurus build inside a unit run is not a test.
#
# `stage: test` rather than `build`, because `build` runs only on the default
# branch and this has to fail on the merge request that breaks a link. The
# `changes:` list is what the site is made of: its own tree, the generated
# sidebar fragment, and the generator that writes it.
build:docs:
  stage: test
  image: node:22.17-slim
  before_script:
    - corepack enable && corepack prepare pnpm@9.15.0 --activate
    - pnpm install --frozen-lockfile
    # The site imports no `@endora-commerce/*` package today, and this stays
    # anyway: it is the uniform rule for every job that runs a workspace script,
    # and Phase 2 makes the site's own tree depend on the module packages'
    # `docs/` layers. A job that is the exception until the day it silently is
    # not is the shape this repository keeps paying for.
    - pnpm run build:packages
  script:
    - pnpm --filter docs run build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - docs/**/*
        - packages/modules/*/docs/**/*
        - backend/scripts/generate-composer.ts
        - packages/cli/src/lib/module-docs.ts
        - pnpm-lock.yaml
        - .gitlab-ci.yml

# ---------------------------------------------------------------------------
# The storefront conformance job — the served HTML is asserted, and the
# accessibility floor is measured in a browser
# (specs/098-storefront-ssr-seo-a11y-suite/ Phase 4;
# contracts/accessibility-floor.md §4).
#
# **This is the only place three of this feature's four claims are decidable.**
# Phases 1–3 judge source text: a block's server render, a route's indexability
# declaration, a client component's effect. Whether the bytes a crawler actually
# receives carry a canonical, one `<h1>`, a meta description and the JSON-LD the
# route declares is a property of a booted storefront, and so is every rule of
# `.claude/skills/ux-laws/SKILL.md` § 4 that turns on computed style — contrast,
# focus visibility and `prefers-reduced-motion`. `scripts/conformance-storefront.sh`
# carries the whole reasoning; it is `boot-gate`'s shape one application over.
# The boot itself is `scripts/lib/storefront-stack.sh`, shared with
# `perf:storefront` since feature 098's Phase 5 — the question the two jobs ask
# differs, getting a storefront to the point of answering one does not, and
# three of its steps are measurements somebody paid for rather than procedure.
#
# **It boots `next start`'s replacement, not the image.** The storefront builds
# with `output: 'standalone'` and Next refuses to serve that build under
# `next start`; the job runs `node .next/standalone/storefront/server.js`, which
# is what `storefront/Dockerfile`'s own `CMD` runs. Building here rather than
# pulling an image is what puts the browser in this job's container and
# `.next/app-path-routes-manifest.json` — the page set's second author — on
# disk. The image stays `build:storefront`'s subject.
#
# **Default branch and a schedule, and deliberately not a merge request**
# (FR-062, `[NEEDS CLARIFICATION #3]`). It migrates a database, seeds it, boots
# a backend, builds the storefront, boots it and drives a browser: 3m06s
# measured on a 16-core developer machine, of which the `next build` is most.
# The runner host is shared — see the Memory block above `test:backend` — and
# `storefront/next.config.js` already caps that build at two workers because it
# was OOM-killed on this box twice. The class of defect it catches is not
# introduced quickly (the JSON-LD gap stood from April), so the merge request
# pays `test:frontend` and `quality`, and this catches the rest afterwards.
#
# It is **not** a `check-*` script and must not become one:
# `test/unit/scripts/check-read-size.test.ts` spawns every one of those, and a
# booted stack inside a unit run is not a test. Its judgement is
# `storefront/test/conformance/{plan,assertions}.ts`, which touch neither the
# network nor a browser and carry a red proof per finding in `test:frontend`.
# ---------------------------------------------------------------------------
conformance:storefront:
  stage: test
  # The Playwright image, so the browser and its system libraries are the
  # version `@playwright/test` expects rather than whatever `playwright install
  # --with-deps` resolves against a bare node image. The tag tracks the
  # `@playwright/test` range in `storefront/package.json`; a mismatch is a
  # browser Playwright refuses to drive, loudly.
  image: mcr.microsoft.com/playwright:v1.60.0-noble
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
    - name: getmeili/meilisearch:v1.11
      alias: meilisearch
  variables:
    POSTGRES_USER: b2b
    POSTGRES_PASSWORD: b2b
    POSTGRES_DB: b2b
    MEILI_MASTER_KEY: devMasterKeyChangeMe
    MEILI_ENV: development
    MEILI_NO_ANALYTICS: 'true'
    # The name follows the disposable `(^|_)test(_|$)` convention `test/global-setup.ts`
    # and the dev-seed guard judge on, and `conformance-storefront.sh` refuses a
    # DSN that does not — the step after the migration drops business data.
    DATABASE_URL: postgresql://b2b:b2b@postgres:5432/b2b_storefront_conformance_test
    REDIS_URL: redis://redis:6379
    MEILISEARCH_URL: http://meilisearch:7700
    MEILISEARCH_API_KEY: devMasterKeyChangeMe
    JWT_SECRET: storefront-conformance-secret-not-a-real-one-0000
    SESSION_COOKIE_SECRET: storefront-conformance-secret-not-a-real-one-0000
    NODE_ENV: development
    LOG_LEVEL: warn
  before_script:
    - corepack enable && corepack prepare pnpm@9.15.0 --activate
    - apt-get update -qq && apt-get install -y -qq postgresql-client curl >/dev/null
    - pnpm install --frozen-lockfile
    - pnpm run build:packages
    - PGPASSWORD=b2b psql -h postgres -U b2b -d postgres -c "create database b2b_storefront_conformance_test"
  script:
    - bash scripts/conformance-storefront.sh
  artifacts:
    when: always
    paths:
      - storefront/test-results/conformance-findings.txt
    expire_in: 1 week
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    # A merge request may ask for it deliberately; it never runs by itself
    # there. `allow_failure` so that asking costs nothing.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
  # Shared with `perf:backend` and `perf:storefront` (feature 098, T501). Two of
  # the three build a Next application on a host whose OOM killer has already
  # taken two concurrent frontend builds, and the other two are wall-clock
  # verdicts this job's `next build` would be measured into.
  resource_group: perf-measurement

# ---------------------------------------------------------------------------
# The storefront performance budget — `.lighthouserc.js` is measured against a
# booted storefront (specs/098-storefront-ssr-seo-a11y-suite/ Phase 5, FR-050).
#
# **This file has existed since T242 and has had no runner since `5b0bfb5dd`
# deleted the GitHub Actions workflows.** `lhci` was a dependency of nothing,
# the config's own header said "NOT RUN BY CI", and Core Web Vitals
# (Constitution VII) were asserted by a developer remembering to run three
# commands. That header is corrected in the merge request that adds this job,
# because a file describing a state a later change silently invalidates is the
# shape this estate keeps finding.
#
# **Schedule only, for `perf:backend`'s reason and not a weaker one.** These are
# wall-clock assertions. The runner host is shared — see the Memory block above
# `test:backend` — and a Largest Contentful Paint measured beside two live
# shards measures contention, so a per-MR gate would be a coin toss that blocks
# merges. `when: manual` on a merge request is for someone deliberately
# measuring a change they suspect.
#
# CI_SCHEDULE_KIND is set on the schedule itself, and the split is about the
# sample count rather than the page set:
#   nightly       three runs per URL — the gate. Lighthouse asserts on the
#                 median, and three is what the committed thresholds were
#                 re-based from.
#   weekly-heavy  five runs per URL. A drift smaller than the run-to-run spread
#                 is invisible at three samples on a 4 vCPU box, and six extra
#                 Lighthouse runs have no place in a nightly.
#
# The first three runs on this runner are RECORDING runs (D-65, as for
# `perf:backend`): `scripts/perf-storefront.sh --record` collects and asserts
# nothing, and every threshold in `.lighthouserc.js` is re-based from what those
# runs measure here. The numbers committed today come from local runs and carry
# that derivation in a comment beside them; they are a starting point, not the
# enforced number.
#
# It is **not** a `check-*` script and must not become one:
# `test/unit/scripts/check-read-size.test.ts` spawns every one of those, and a
# booted stack plus a browser inside a unit run is not a test.
# ---------------------------------------------------------------------------
perf:storefront:
  stage: test
  # The Playwright image, for `conformance:storefront`'s reasons — the browser
  # and its system libraries are the version `@playwright/test` expects. This
  # job drives Chrome through Lighthouse rather than through Playwright, and
  # `scripts/perf-storefront.sh` derives `CHROME_PATH` from that same package,
  # so the repository ships one browser rather than one per job.
  image: mcr.microsoft.com/playwright:v1.60.0-noble
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
    - name: getmeili/meilisearch:v1.11
      alias: meilisearch
  variables:
    POSTGRES_USER: b2b
    POSTGRES_PASSWORD: b2b
    POSTGRES_DB: b2b
    MEILI_MASTER_KEY: devMasterKeyChangeMe
    MEILI_ENV: development
    MEILI_NO_ANALYTICS: 'true'
    # The disposable `(^|_)test(_|$)` convention `test/global-setup.ts` and the
    # dev-seed guard judge on, and `scripts/lib/storefront-stack.sh` refuses a
    # DSN that does not — the seed it runs drops business data.
    DATABASE_URL: postgresql://b2b:b2b@postgres:5432/b2b_storefront_perf_test
    REDIS_URL: redis://redis:6379
    MEILISEARCH_URL: http://meilisearch:7700
    MEILISEARCH_API_KEY: devMasterKeyChangeMe
    JWT_SECRET: storefront-perf-secret-not-a-real-one-00000000
    SESSION_COOKIE_SECRET: storefront-perf-secret-not-a-real-one-00000000
    NODE_ENV: development
    LOG_LEVEL: warn
  before_script:
    - corepack enable && corepack prepare pnpm@9.15.0 --activate
    - apt-get update -qq && apt-get install -y -qq postgresql-client curl >/dev/null
    - pnpm install --frozen-lockfile
    - pnpm run build:packages
    - PGPASSWORD=b2b psql -h postgres -U b2b -d postgres -c "create database b2b_storefront_perf_test"
  script:
    # `@lhci/cli` is fetched with a pinned `pnpm dlx` inside the script rather
    # than declared: this is the only job that runs it, so declaring it would
    # cost `pnpm install --frozen-lockfile` in the other thirteen and buy this
    # one nothing (plan.md § Complexity Tracking).
    - LH_RUNS=3
    - if [ "$CI_SCHEDULE_KIND" = "weekly-heavy" ]; then LH_RUNS=5; fi
    - LHCI_NUMBER_OF_RUNS="$LH_RUNS" bash scripts/perf-storefront.sh
  artifacts:
    when: always
    paths:
      - storefront/test-results/lighthouse
    expire_in: 1 week
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
  # The same fact about this host that serialises `test:backend`'s shards and
  # the image builds. Three heavy jobs run on the nightly schedule — this one,
  # `perf:backend` and `conformance:storefront` — the runner is 4 vCPU with
  # `concurrent=2`, and two of the three build a Next application whose build
  # `storefront/next.config.js` already caps at two workers because it was
  # OOM-killed on this box twice. Two of them are also wall-clock verdicts, and
  # a p95 or an LCP measured beside another job measures the other job. Costs
  # nightly wall clock, which nobody is waiting on; revisit from the runner's
  # own `concurrent` setting once the suite has a machine to itself.
  resource_group: perf-measurement

# ---------------------------------------------------------------------------
# Build — Docker images → GitLab Container Registry
# ---------------------------------------------------------------------------
.build-base:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    # dind without TLS — the daemon listens on plain 2375 and the client targets
    # it directly. TLS (DOCKER_TLS_CERTDIR=/certs → daemon on 2376) would need the
    # /certs/client volume shared in the runner config; not worth it for a
    # self-hosted runner on a trusted host. Both sides must agree on 2375.
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  # Memory, and the same fact about this host that serialises `test:backend`.
  # The three image builds share one stage and used to run concurrently: two of
  # them are frontend builds (Vite and Next), each of which holds the whole
  # module graph in one process, and the runner is 4 vCPU on a box that also
  # carries another project. Pipeline 11938 died `cannot allocate memory` in
  # `build:admin` **and** `build:storefront` at once, which is the shape a
  # concurrency limit fixes and a heap flag does not — the OOM is the host's,
  # not V8's, so `--max-old-space-size` would only move which fork the kernel
  # picks. Serialising costs wall clock on a stage that already only runs on
  # `master`. Revisit from the runner's own `concurrent` setting once the suite
  # has a machine to itself, not from here.
  resource_group: image-builds

build:backend:
  extends: .build-base
  script:
    # `DEPLOYMENT` reaches a build for the first time here (feature 110, FR-009).
    # It selects the deployment whose overlay modules and `divergence.ts` compose;
    # blank is bare core, byte-for-byte, which is what `selectedDeployment` reads a
    # whitespace value as — so an image built with the variable unset is exactly
    # the image this job produced before.
    - docker build -f backend/Dockerfile
      --build-arg DEPLOYMENT="${DEPLOYMENT}"
      -t "$CI_REGISTRY_IMAGE/backend:$IMAGE_TAG"
      -t "$CI_REGISTRY_IMAGE/backend:latest" .
    - docker push "$CI_REGISTRY_IMAGE/backend:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE/backend:latest"

build:storefront:
  extends: .build-base
  script:
    - docker build -f storefront/Dockerfile
      --build-arg NEXT_PUBLIC_API_BASE_URL="https://${API_DOMAIN}"
      --build-arg NEXT_PUBLIC_SALES_CHANNEL_CODE="${SALES_CHANNEL_CODE}"
      --build-arg NEXT_PUBLIC_DEFAULT_LOCALE="${DEFAULT_LOCALE:-en-US}"
      -t "$CI_REGISTRY_IMAGE/storefront:$IMAGE_TAG"
      -t "$CI_REGISTRY_IMAGE/storefront:latest" .
    - docker push "$CI_REGISTRY_IMAGE/storefront:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE/storefront:latest"

build:admin:
  extends: .build-base
  # `admin`'s `build` script is `vite build` and deliberately does **not** run
  # `tsc --noEmit`. `storefront`'s never did; `admin` was the outlier.
  #
  # Two reasons, and the second is the one that matters. The type-check is
  # already `quality`'s, an earlier stage that gates this one, so running it
  # again here is duplication. And the image build's context is not this
  # repository: `admin/Dockerfile` copies the manifests, `tsconfig.base.json`,
  # `packages/` and `admin/` — not the repository root's `scripts/`. So a
  # type-check inside the image checks a *different tree* than the one CI
  # verified, and the first thing it found was a test file legitimately
  # importing `scripts/tailwind-source-scan.ts` (feature 080, T044): green in
  # every local run and in `quality`, red only here (pipeline 11613).
  #
  # A check that reads a truncated copy of the tree is worse than no check
  # there, because its red says "your code is broken" when it means "my copy
  # is short".
  script:
    - docker build -f admin/Dockerfile
      --build-arg VITE_API_BASE_URL="https://${API_DOMAIN}"
      -t "$CI_REGISTRY_IMAGE/admin:$IMAGE_TAG"
      -t "$CI_REGISTRY_IMAGE/admin:latest" .
    - docker push "$CI_REGISTRY_IMAGE/admin:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE/admin:latest"

# ---------------------------------------------------------------------------
# Deploy — SSH to the VPS, pull tagged images, recreate the stack
# ---------------------------------------------------------------------------
deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    # SSH_PRIVATE_KEY and SSH_KNOWN_HOSTS are "File" type CI/CD variables (masked
    # Variables reject the newlines an SSH key / known_hosts contain), so each
    # variable resolves to a PATH to a file holding the content — not the content.
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
    - eval "$(ssh-agent -s)"
    - chmod 600 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
  script:
    # Ship the latest compose file (secrets/.env + host nginx config stay on the
    # VPS; TLS is terminated by the host's existing nginx, not this stack).
    - scp deploy/compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST"
      "cd $DEPLOY_PATH &&
       echo '$CI_JOB_TOKEN' | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY &&
       export IMAGE_TAG=$IMAGE_TAG &&
       docker compose --env-file .env -f compose.prod.yml pull &&
       docker compose --env-file .env -f compose.prod.yml up -d --remove-orphans &&
       docker image prune -f"
  environment:
    name: production
    url: https://$STOREFRONT_DOMAIN
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  allow_failure: false

# ---------------------------------------------------------------------------
# Publish — the packages a scaffolded storefront resolves, to the registry a CI
# variable names (feature 104, D-203)
#
# It runs on a **release branch** and nowhere else: `version:packages` cuts
# `release/version-<date>`, consumes the changesets and moves the versions, and
# this is what puts the result on a registry. `release:changeset` recognises the
# same branch from its diff — it deletes changeset files and adds none — and
# asks it the inverted question, whether anything's `version` actually moved. A
# rule cannot read a diff, so the gate here is the branch shape that script
# writes, plus `when: manual`: a publish is a deliberate act, and on npmjs
# `package@version` can never be reused.
#
# **The protected-branch coupling is the operator's step.** `ENDORA_NPM_TOKEN`
# is protected, so GitLab resolves it only on a protected ref — protect
# `release/*` in Settings → Repository → Protected branches, or the job's first
# refusal fires. That refusal is the fail-closed direction and is deliberate: an
# unset registry variable would otherwise publish to `registry.npmjs.org`, which
# is npm's default and the one place this rehearsal must not reach.
#
# `changeset publish` writes a local git tag for each **public** package it
# publishes, whatever `privatePackages.tag` says — that field governs private
# packages only (`@changesets/cli@3.0.1`, `dist/git-tag.mjs`). Nothing pushes
# them, and the container is discarded, so they anchor nothing until D-160.5's
# tag question is answered by the merge request that makes a package public on
# npmjs.
# ---------------------------------------------------------------------------
publish:packages:
  stage: deploy
  image: node:22.17-slim
  variables:
    # `changeset publish` tags what it publishes, so it shells out to git.
    GIT_DEPTH: 0
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - corepack enable && corepack prepare pnpm@9.15.0 --activate
    - pnpm install --frozen-lockfile
    # Every package resolves at its own `dist`, and `changeset publish` packs
    # what is on disk: an unbuilt workspace publishes tarballs with no code in
    # them. This is also `toolchain-supply.test.ts`' rule — a job that runs a
    # workspace script builds first — and the script below runs one.
    - pnpm run build:packages
  script:
    - |
      set -e
      if [ -z "$ENDORA_NPM_REGISTRY" ]; then
        echo "publish:packages — ENDORA_NPM_REGISTRY is unset. Publishing anyway would send these packages to registry.npmjs.org, which is npm's default and the one registry this rehearsal must not reach; a version spent there can never be reused. Set the variable (protected), and protect this branch pattern so GitLab resolves it." >&2
        exit 2
      fi
      if [ -z "$ENDORA_NPM_TOKEN" ]; then
        echo "publish:packages — ENDORA_NPM_TOKEN is unset. It is a protected variable, so this is what an unprotected ref looks like: the publish would be attempted anonymously and the registry would answer 404, which is the same sentence it gives for a package that does not exist." >&2
        exit 2
      fi
    - |
      # The scope is derived from the packages that are about to be published,
      # never written here: `check:release-intent`'s `unresolvable-scope` holds
      # them to exactly one, and a second copy of the answer in a CI file is the
      # derived fact D-100 forbids.
      #
      # It is asked of that same check rather than computed here, and the reason
      # is the defect this line replaces. The derivation used to live in this
      # file as a `readdir("packages")` one level deep, which is the
      # `build:packages` single-star problem arriving a second time through a
      # `readdir`: `packages/modules` carries no `package.json` of its own, so
      # the read threw, the `catch` swallowed it, and all 70 module packages
      # under it were invisible. Correct for the three top-level public packages
      # and silently wrong from the first public module package onward — which
      # D-203's shape-2 client needs, since an instance installs every module
      # from a registry. The symptom would have been a publish that authenticated
      # for a scope it never derived, or published nothing for one, while the job
      # reported success.
      #
      # `--print-publish-scope` walks the **workspace members** instead:
      # `pnpm-workspace.yaml` already enumerates `packages/*` and
      # `packages/modules/*`, and a third entry changes the answer by being
      # written there. Nothing in this job names a directory. Stdout is the scope
      # and nothing else; the disclosure of what it read goes to stderr, into the
      # job log.
      #
      # `exec tsx`, not `run check:release-intent --`: `pnpm run` prints its
      # `> backend@0.0.0 …` banner on **stdout**, which this command substitution
      # would capture into the `.npmrc` line (measured).
      set -e
      scope=$(pnpm --filter backend exec tsx scripts/check-release-intent.ts --print-publish-scope)
    - |
      # The token is written as an environment **reference**, not as a value:
      # pnpm expands `${VAR}` in `.npmrc` in both the registry and the auth
      # position (measured, feature 104 research §5), so no file in this job
      # holds the secret and nothing can print it by cat-ing one. It goes to
      # `$HOME`, not the checkout, so it cannot be committed or packed.
      set -e
      printf '%s:registry=%s\n' "$scope" "$ENDORA_NPM_REGISTRY" > "$HOME/.npmrc"
      printf '%s:_authToken=${ENDORA_NPM_TOKEN}\n' "${ENDORA_NPM_REGISTRY#*:}" >> "$HOME/.npmrc"
      echo "publish:packages — publishing $scope to $ENDORA_NPM_REGISTRY"
    # The last gate before a publish. `quality` does not run on a branch
    # pipeline — its rules are a merge request or the default branch — so
    # without this line the release branch would publish having been judged only
    # by the merge request that wrote it.
    - pnpm --filter backend run check:release-intent
    - |
      set -e
      status=0
      pnpm exec changeset publish > changeset-publish.log 2>&1 || status=$?
      cat changeset-publish.log
      if [ "$status" -ne 0 ]; then exit "$status"; fi
      # `changeset publish` exits 0 when it has nothing to publish, which is the
      # same silence `version:packages` refuses on the version half: a release
      # branch that consumed changesets and published nothing has either already
      # published this version, or been read by a configuration that cannot see
      # the packages at all.
      if grep -q 'No unpublished projects to publish' changeset-publish.log; then
        echo "publish:packages — this branch consumed changesets and published nothing. \`changeset publish\` reports a plan of zero releases and exits 0, which is byte-identical to a successful publish. Check that the versions moved (\`release:changeset\` asks that question) and that \`.changeset/config.json\` still sees the packages." >&2
        exit 2
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\/version-/'
      when: manual
  allow_failure: false
