# Production stack for a single VPS.
#
# Runs on the server, NOT in CI: this repository's pipeline deploys no stack
# (D-274). Images are built and pushed to a registry; this file pulls them by
# tag and wires the runtime topology:
#
#   host nginx (TLS via certbot)
#     ├─ https://${STOREFRONT_DOMAIN} → ${STOREFRONT_HOST_PORT} → storefront:3000
#     ├─ https://${ADMIN_DOMAIN}      → ${ADMIN_HOST_PORT}      → admin:80
#     └─ https://${API_DOMAIN}        → ${API_HOST_PORT}        → backend:3001
#
# This stack does NOT terminate TLS. The host's own nginx does (Let's Encrypt via
# certbot) and reverse-proxies each public name to a port this stack publishes on
# loopback only (defaults 127.0.0.1:3000 / :8080 / :3001; see
# deploy/nginx.example.conf). Nothing else reaches the apps: postgres, redis and
# meilisearch publish no port at all and live on the stack-private `internal`
# network.
#
# It starts anywhere and beside another stack. No service fixes a
# `container_name` and no network is external, so the compose project names
# everything: a second stack on the same host is a second `-p <project>`, its own
# directory, its own `.env` (fresh secrets, its own *_HOST_PORT binds) and its own
# volumes. `backend/test/unit/ci/compose-prod.test.ts` holds both.
#
# Order of a start: postgres healthy → `backend-migrate` (migrations) →
# `backend-install` (every module's install hooks, `module:install --all`,
# idempotent) → `backend` → storefront. A database whose first act after the
# migrations is a boot never runs its install hooks, so the install step is not
# optional on a fresh database and is a no-op on an installed one.
#
# Stateful services (postgres / redis / meilisearch) live on the same host with
# named volumes.
#
# Usage on the VPS (see deploy/README.md):
#   IMAGE_TAG=<sha> docker compose --env-file .env -f compose.prod.yml up -d
#
# `.env` (next to this file, never committed) supplies secrets + domains +
# REGISTRY_IMAGE; IMAGE_TAG is supplied per deploy.

x-backend-env: &backend-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  PORT: "3001"
  DATABASE_URL: postgresql://${POSTGRES_USER:-b2b}:${POSTGRES_PASSWORD:-b2b}@postgres:5432/${POSTGRES_DB:-b2b}
  REDIS_URL: redis://redis:6379
  MEILISEARCH_URL: http://meilisearch:7700
  MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY}
  # Public URLs (OAuth redirects, email links, CORS).
  BACKEND_PUBLIC_URL: https://${API_DOMAIN}
  # Same origin under the name the payment gateways, the public product feeds
  # and the newsletter confirmation links read (issue #218). Derived rather
  # than asked for in `.env`, because there is only one right answer and an
  # operator who has to supply it can leave it out: it used to default to
  # `http://localhost:3001`, which handed every gateway a callback URL nothing
  # on the internet can reach — so no payment was ever confirmed, and nothing
  # logged or refused. The backend now refuses to boot in production when
  # neither this nor BACKEND_PUBLIC_URL is set.
  PUBLIC_API_BASE_URL: https://${API_DOMAIN}
  ADMIN_BASE_URL: https://${ADMIN_DOMAIN}
  STOREFRONT_BASE_URL: https://${STOREFRONT_DOMAIN}
  CORS_ALLOWED_ORIGINS: https://${STOREFRONT_DOMAIN},https://${ADMIN_DOMAIN}
  # Shared secret for the storefront's on-demand cache revalidation endpoint
  # (`storefront/app/api/revalidate/route.ts`). It must be the SAME value on
  # both services; unset, the backend's revalidator is a silent no-op and a
  # catalogue or CMS change never reaches the rendered storefront.
  REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
  # Secrets — generate per environment, see deploy/.env.prod.example.
  SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET}
  # Signs newsletter confirmation and unsubscribe links. Unset, the backend
  # signs them with the session key, so rotating that key invalidates every
  # link still waiting in an inbox.
  NEWSLETTER_TOKEN_SECRET: ${NEWSLETTER_TOKEN_SECRET}
  SETTINGS_SECRET_ENCRYPTION_KEY: ${SETTINGS_SECRET_ENCRYPTION_KEY}
  MFA_SECRET_ENCRYPTION_KEY: ${MFA_SECRET_ENCRYPTION_KEY}
  ASSETS_LIBRARY_HMAC_KEY: ${ASSETS_LIBRARY_HMAC_KEY}
  # Which upstream proxy may be believed about the client address (issue #220).
  # Unset, the backend trusts none and `request.ip` is this stack's own nginx —
  # see deploy/.env.prod.example for why 1 is the answer here.
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-}
  TRUSTED_PROXY_ADDRESSES: ${TRUSTED_PROXY_ADDRESSES:-}
  # Sales channels.
  DEFAULT_SALES_CHANNEL_CODE: ${DEFAULT_SALES_CHANNEL_CODE:-default}
  SALES_CHANNEL_HOST_MAP: ${SALES_CHANNEL_HOST_MAP:-}
  # Email (optional — unset SMTP_URL falls back to a console mailer).
  SMTP_URL: ${SMTP_URL:-}
  SMTP_FROM: ${SMTP_FROM:-no-reply@${STOREFRONT_DOMAIN}}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-b2b}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-b2b}
      POSTGRES_DB: ${POSTGRES_DB:-b2b}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-b2b} -d ${POSTGRES_DB:-b2b}']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - internal
    healthcheck:
      # NB: 127.0.0.1, not localhost — the image's /etc/hosts maps localhost to
      # ::1 too, and meilisearch binds IPv4 only (0.0.0.0:7700). busybox wget
      # hits ::1 first, gets ECONNREFUSED and gives up (curl would fall back to
      # IPv4, busybox wget does not) → the check always reports unhealthy.
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:7700/health']
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: apply DB migrations before the API starts. Exits 0 on success.
  #
  # Built output, like the API itself (feature 080, D-165). The interpreted
  # spelling — `pnpm exec tsx src/db/migrate.ts up` — is what stood here, and a
  # migrate job running a different build of the application from the one about
  # to serve requests is the half-built state that ruling exists to close.
  backend-migrate:
    image: ${REGISTRY_IMAGE}/backend:${IMAGE_TAG:-latest}
    command: ['node', 'dist/db/migrate.js', 'up']
    environment: *backend-env
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # One-shot: run every module's install hooks once the schema exists, before
  # the API starts. Idempotent — an installed module reports itself done — so it
  # runs on every start, like the migrations. Same image, same environment, and
  # it needs Redis as well as Postgres (the install command opens both).
  backend-install:
    image: ${REGISTRY_IMAGE}/backend:${IMAGE_TAG:-latest}
    command: ['node', 'dist/lifecycle/scripts/install.js', '--all']
    environment: *backend-env
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    restart: 'no'

  backend:
    image: ${REGISTRY_IMAGE}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *backend-env
    # Published on loopback only — the host nginx proxies ${API_DOMAIN} here.
    ports:
      - '${API_HOST_PORT:-127.0.0.1:3001}:3001'
    volumes:
      # Local-FS assets adapter writes under backend/var — persist it.
      - backend-assets:/app/backend/var
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      backend-install:
        condition: service_completed_successfully
    healthcheck:
      test:
        ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/api/v1/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  storefront:
    image: ${REGISTRY_IMAGE}/storefront:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      # Server-side fetcher → internal backend (NEXT_PUBLIC_* were baked at build).
      BACKEND_BASE_URL: http://backend:3001
      # The other half of the revalidation seam: this is the secret
      # `/api/revalidate` compares the backend's header against. Unset here and
      # the endpoint answers 401 to a backend that is configured correctly.
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      #
      # THE PUBLIC ORIGIN IS NOT SETTABLE HERE, AND THAT IS WHY IT IS WRITTEN
      # DOWN. The origin this shop names in every canonical link, in its sitemap
      # and in its robots.txt is `NEXT_PUBLIC_SITE_URL`, which `build:storefront`
      # passes as `https://${STOREFRONT_DOMAIN}` — the same variable the
      # backend's own `STOREFRONT_BASE_URL` above is built from. Adding it to
      # this block would change nothing and would read as though it did:
      # measured on this tree, `next build` inlines the value and drops the
      # variable's name from `.next/server` altogether, and `/robots.txt` is
      # prerendered, so its `Sitemap:` line is a static file inside the image.
      # An image built without that argument serves `http://localhost:3000` in
      # all three places — the fallback in `storefront/lib/seo/site-url.ts` —
      # and the repair is to rebuild, never to set a variable here.
    # Published on loopback only — the host nginx proxies ${STOREFRONT_DOMAIN} here.
    ports:
      - '${STOREFRONT_HOST_PORT:-127.0.0.1:3000}:3000'
    networks:
      # internal → server-side fetch to backend:3001.
      - internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  admin:
    image: ${REGISTRY_IMAGE}/admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Published on loopback only — the host nginx proxies ${ADMIN_DOMAIN} here.
    ports:
      - '${ADMIN_HOST_PORT:-127.0.0.1:8080}:80'
    networks:
      # admin is a static SPA and talks to the API from the browser.
      - internal
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:80/']
      interval: 10s
      timeout: 3s
      retries: 6

  # There is deliberately no `seed` service here (issue #218). This file used to
  # define one that ran the developer demo seed — which truncates the public
  # catalog and business tables — with `ALLOW_DEV_SEED_IN_PRODUCTION=true` set
  # permanently. That flag exists so an accidental run cannot wipe real data,
  # and pre-setting it in the production compose file disarmed the one guard
  # that stood between a client's deployment and a truncate. Two accidents kept
  # it harmless: a `seed` profile, and a `command` naming a path that does not
  # exist — so the moment somebody "fixed the path" the README's own deployment
  # steps would have wiped the catalogue.
  #
  # Populating a demo host is still supported, but the operator types both
  # overrides themselves, at the moment they mean it (see deploy/README.md):
  #   docker compose --env-file .env -f compose.prod.yml run --rm \
  #     -e ALLOW_DEV_SEED_IN_PRODUCTION=true \
  #     -e ALLOW_DEV_SEED_ON_NON_LOCAL_DATABASE=true \
  #     backend node dist/cli.js demo seed

networks:
  # Stack-private network for all services (DB/cache/search + apps talk here).
  # Created per compose project, so two stacks on one host never share it.
  internal:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  meilisearch-data:
  backend-assets:
