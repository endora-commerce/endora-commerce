# Host-nginx server block for the DOCUMENTATION SITE — a static document root.
#
# `docs.commerce.endora.software` is not an application. It is the Docusaurus
# build: produced by `build:docs` in ../.gitlab-ci.yml, judged by
# `verify:docs-build`, shipped to the VPS by `publish:docs`, and served straight
# off disk by the VPS's existing host nginx. So, unlike `nginx.example.conf`
# beside it, this block has NO proxy_pass, no loopback port, no container, no
# Docker volume and no `public_proxy` network — the documentation site appears
# nowhere in compose.prod.yml (see deploy/README.md § The documentation site).
#
# This file is a TEMPLATE — it is NOT shipped or applied by CI. The host nginx
# config is owned by the operator, and CI's share ends at the rsync into
# `$DOCS_DEPLOY_PATH/releases/<sha>/` plus `publish-docs.sh`'s flip of `current`:
#
#   sudo cp nginx.docs.example.conf /etc/nginx/sites-available/docs
#   sudo ln -s /etc/nginx/sites-available/docs /etc/nginx/sites-enabled/docs
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d docs.commerce.endora.software
#
# `certbot --nginx` rewrites the block in place: adds `listen 443 ssl`, the
# ssl_certificate lines and an HTTP→HTTPS redirect. The block below starts as a
# plain :80 listener so certbot has something to attach to — exactly as the
# neighbouring template documents for the other three domains.
#
# **`$DOCS_DEPLOY_PATH` below is a placeholder you substitute by hand, not a
# variable nginx expands.** nginx reads no environment at config time; left as
# written, `nginx -t` fails with `unknown "docs_deploy_path" variable`. Replace
# it with the same literal path the CI/CD variable holds, e.g.
# `/var/www/docs.commerce.endora.software`.

server {
    listen 80;
    listen [::]:80;
    server_name docs.commerce.endora.software;

    # `current` is a symlink to `releases/<sha>`, flipped by
    # deploy/publish-docs.sh. nginx resolves it per request, so a publication —
    # and a rollback — is picked up without a reload.
    root $DOCS_DEPLOY_PATH/current;     # ← substitute the literal path
    index index.html;

    # The two search indexes are 4.6 MB and 5.2 MB of JSON and nginx's default
    # `gzip_types` is text/html alone, so without this every reader who opens
    # search downloads the whole index uncompressed. text/html is compressed by
    # `gzip on` itself and needs no entry in the list.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css application/xml image/svg+xml;

    # The content-hashed bundle: every filename under /assets/ carries a hash of
    # its own content, so a URL there never changes meaning and a year is safe
    # (FR-030). `^~` so this prefix wins outright over the regex blocks below.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # The two search indexes are NOT covered by the rule above — measured on the
    # Phase 4 build, 2026-09-23. `@easyops-cn/docusaurus-search-local` is
    # configured `hashed: true`, which hashes the QUERY STRING and not the
    # filename: the bundle requests `search-index.json?_=<hash>`, and the files
    # sit at the stable paths /search-index.json and /pl/search-index.json,
    # outside /assets/. An `immutable` rule keyed on a content-hashed filename
    # therefore does not reach them, and a rule that claimed to would pin a
    # stale index under a name every build reuses. They revalidate instead: the
    # query string already makes each build's index a new URL, and where it does
    # not, nginx's ETag turns the repeat request into a 304 rather than 4.6 MB.
    location ~ ^/(?:[a-z]{2}/)?search-index\.json$ {
        add_header Cache-Control "no-cache" always;
    }

    # One sitemap per locale and no sitemap index — docs/static/robots.txt names
    # both. A published correction has to become crawlable immediately (FR-030).
    location ~ ^/(?:[a-z]{2}/)?sitemap\.xml$ {
        add_header Cache-Control "no-cache" always;
    }

    location = /robots.txt {
        add_header Cache-Control "no-cache" always;
    }

    # Everything else: the HTML, and the few unhashed static files under /img/.
    # `no-cache` means "store it, but revalidate before reuse", so a published
    # correction reaches readers on their next request (FR-030) at the cost of
    # one conditional GET that nginx answers with a 304.
    #
    # Deliberately no `try_files`: the site is built with `trailingSlash: true`,
    # so every route is a directory holding index.html, and letting nginx's own
    # index module 301 `/path` → `/path/` keeps exactly one URL per page — the
    # one the canonical link and the sitemap declare. `try_files $uri $uri/`
    # would answer both forms with 200 and publish every page under two URLs.
    location / {
        add_header Cache-Control "no-cache" always;
    }

    # The site's own 404 page, not nginx's default (FR-031). It is served
    # through `location /` above, and `always` is what carries the header onto
    # it: a bare `add_header` applies to 2xx/3xx responses only.
    error_page 404 /404.html;
}
