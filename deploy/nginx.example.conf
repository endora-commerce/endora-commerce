# Reverse-proxy config for the VPS's EXISTING host nginx.
#
# The Docker stack (deploy/compose.prod.yml) publishes the three apps on
# loopback host ports; this host nginx terminates TLS (Let's Encrypt) and
# proxies each public (sub)domain to the matching local port:
#
#   ${STOREFRONT_DOMAIN}  → 127.0.0.1:3000   (storefront, Next.js SSR)
#   ${ADMIN_DOMAIN}       → 127.0.0.1:8080   (admin, nginx static SPA)
#   ${API_DOMAIN}         → 127.0.0.1:3001   (backend, Fastify + workers)
#
# This file is a TEMPLATE — it is NOT shipped or applied by CI (the host nginx
# config is owned by the operator). Copy it onto the VPS, replace the three
# server_name placeholders with your real domains, then let certbot add TLS:
#
#   sudo cp nginx.example.conf /etc/nginx/sites-available/b2b
#   sudo ln -s /etc/nginx/sites-available/b2b /etc/nginx/sites-enabled/b2b
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d example.com -d admin.example.com -d api.example.com
#
# `certbot --nginx` rewrites each block in place: adds `listen 443 ssl`, the
# ssl_certificate lines, and an HTTP→HTTPS redirect. The blocks below start as
# plain :80 so certbot has something to attach to. If the host ports differ from
# the defaults, update the proxy_pass targets to match compose.prod.yml.

# Next.js (and Fastify SSE/websocket upgrades) need the Connection/Upgrade dance.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Shared proxy headers — preserve the public host + scheme so the apps build
# correct absolute URLs (OAuth redirects, email links, cookies).
#   place this snippet inline; nginx has no "include from string", so it is
#   repeated per block below.

# --- Storefront -------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name example.com;            # ← STOREFRONT_DOMAIN

    # Allow large catalog imports / asset uploads through to the API-less SSR.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 120s;

        # Headroom for the storefront's response headers. Nothing the storefront
        # writes needs it: the quick-order preview, which rode in a cookie sized
        # to nginx's DEFAULTS (proxy_buffer_size 4k, a 502 past it;
        # large_client_header_buffers 4 8k, a 400 past it), is kept by the backend
        # since #809. These lines are a margin, so headers you add yourself (a CSP,
        # HSTS, more cookies) do not run into those defaults.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        # THE SALES CHANNEL IS A REQUEST HEADER, AND NGINX PASSES A VISITOR'S ON.
        # The storefront serves the sales channel named in `X-Sales-Channel`, and
        # with none it serves the backend's default channel. Left as it is, this
        # block forwards whatever a visitor sends — and what a channel serves is
        # not only pages: `/robots.txt` and the robots directive differ per
        # channel too. Uncomment exactly one:
        #
        #   one storefront, one channel — drop the header:
        # proxy_set_header X-Sales-Channel "";
        #
        #   several channels, one `server` block per host — name this host's:
        # proxy_set_header X-Sales-Channel "pl_retail";
        #
        # If you add `proxy_cache` here, `/robots.txt` is sent with
        # `Vary: X-Sales-Channel`; nginx honours `Vary`, but put the header in
        # `proxy_cache_key` anyway if one cache serves several hosts.
    }
}

# --- Admin SPA --------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name admin.example.com;      # ← ADMIN_DOMAIN

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

# --- Backend API ------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;        # ← API_DOMAIN

    # File uploads (assets library, bulk import) go straight to the API.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
